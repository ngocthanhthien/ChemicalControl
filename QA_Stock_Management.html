  out.querySelector('#mv-csv').addEventListener('click', () => downloadFile('QA_Report_BienDong_' + todayISO() + '.csv', rowsToCsv(lastHeaders, lastRows), 'text/csv;charset=utf-8'));
  out.querySelector('#mv-print').addEventListener('click', () => window.print());

  await refresh();
}

// ---- Interactive report 2: per-item yearly usage chart (budget-planning reference) ----

// Hand-rolled SVG bar chart — no charting library, consistent with the rest of the app's
// no-CDN/offline-first policy (same spirit as the hand-rolled QR encoder / xlsx writer).
function buildBarChartSvg(values, unit) {
  const W = 760, H = 260, padL = 55, padR = 20, padT = 20, padB = 34;
  const chartW = W - padL - padR, chartH = H - padT - padB;
  const max = Math.max(1, ...values);
  const gap = 8;
  const barW = (chartW - gap * (values.length - 1)) / values.length;
  let bars = '', labels = '';
  values.forEach((v, i) => {
    const barH = (v / max) * chartH;
    const x = padL + i * (barW + gap);
    const y = padT + chartH - barH;
    bars += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + Math.max(0, barH).toFixed(1) + '" fill="#0f766e" rx="3"></rect>';
    if (v > 0) bars += '<text x="' + (x + barW / 2).toFixed(1) + '" y="' + (y - 4).toFixed(1) + '" font-size="10" text-anchor="middle" fill="#1f2937">' + fmtNum(v) + '</text>';
    labels += '<text x="' + (x + barW / 2).toFixed(1) + '" y="' + (H - padB + 16).toFixed(1) + '" font-size="11" text-anchor="middle" fill="#4b5563">T' + (i + 1) + '</text>';
  });
  const gridLines = [0, 0.5, 1].map(f => {
    const y = padT + chartH - f * chartH;
    return '<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + y.toFixed(1) + '" stroke="#e2e8f0" stroke-width="1"></line>' +
      '<text x="' + (padL - 8) + '" y="' + (y + 3).toFixed(1) + '" font-size="10" text-anchor="end" fill="#4b5563">' + fmtNum(Math.round(f * max)) + '</text>';
  }).join('');
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;max-width:800px;height:auto;display:block" role="img" aria-label="Biểu đồ tiêu thụ theo tháng">' +
    gridLines + bars + labels +
    '<text x="' + padL + '" y="14" font-size="11" fill="#4b5563">Đơn vị: ' + escapeHtml(unit || '') + '</text>' +
    '</svg>';
}

async function renderUsageChartReport(out, def, uiState) {
  const txs = await getAllTransactions();
  const years = Array.from(new Set(txs.map(t => (t.date || '').slice(0, 4)).filter(Boolean))).sort().reverse();
  const currentYear = String(new Date().getFullYear());
  if (!years.includes(currentYear)) years.unshift(currentYear);
  const items = (await getAllItems()).filter(i => i.active !== false).sort((a, b) => a.itemCode.localeCompare(b.itemCode));
  const initialCode = (uiState && uiState.itemCode) || (items[0] ? items[0].itemCode : '');
  const initialYear = (uiState && uiState.year) || currentYear;
  const combobox = await itemComboboxHtml('uc-item', initialCode);

  out.innerHTML = `
    <div class="card">
      <div class="quick-actions" style="margin-bottom:10px">
        <h3 style="margin:0;flex:1">${def.icon} ${def.title}</h3>
      </div>
      <p class="field-hint">Chọn 1 mặt hàng và 1 năm để xem lượng tiêu thụ (Xuất kho + Hủy bỏ) theo từng tháng — dùng làm cơ sở tham khảo lập ngân sách năm sau.</p>
      <div class="form-grid" style="margin-bottom:14px">
        <div class="form-field"><label>Mặt hàng</label>${combobox}</div>
        <div class="form-field"><label>Năm</label><select id="uc-year">${years.map(y => '<option value="' + y + '" ' + (y === initialYear ? 'selected' : '') + '>' + y + '</option>').join('')}</select></div>
      </div>
      <div id="uc-chart-wrap"></div>
      <div class="table-wrap" style="margin-top:14px"><table class="data-table" id="uc-table"></table></div>
      <div class="form-actions" style="justify-content:flex-start;margin-top:10px">
        <button class="btn btn-secondary btn-sm" id="uc-excel">⭳ Xuất Excel</button>
      </div>
    </div>
  `;
  let lastHeaders = [], lastRows = [];

  async function refresh() {
    const itemCode = itemComboboxValue(out, 'uc-item');
    const year = out.querySelector('#uc-year').value;
    const wrap = out.querySelector('#uc-chart-wrap');
    const table = out.querySelector('#uc-table');
    if (!itemCode) { wrap.innerHTML = '<p class="field-hint">Chưa chọn mặt hàng.</p>'; table.innerHTML = ''; lastHeaders = []; lastRows = []; return; }
    const item = await getItemByCode(itemCode);
    const monthly = new Array(12).fill(0);
    txs.forEach(t => {
      if (t.itemCode !== itemCode || (t.type !== 'OUT' && t.type !== 'DISPOSAL')) return;
      if ((t.date || '').slice(0, 4) !== year) return;
      const m = parseInt(t.date.slice(5, 7), 10);
      if (m >= 1 && m <= 12) monthly[m - 1] += Math.abs(t.quantity);
    });
    const total = monthly.reduce((s, v) => s + v, 0);
    wrap.innerHTML = buildBarChartSvg(monthly, item.unit);
    lastHeaders = ['Tháng', 'Tiêu thụ (' + item.unit + ')'];
    lastRows = monthly.map((v, i) => ['Tháng ' + (i + 1), fmtNum(v)]);
    lastRows.push(['TỔNG CẢ NĂM', fmtNum(total)]);
    table.innerHTML = '<thead><tr><th>Tháng</th><th class="num">Tiêu thụ (' + escapeHtml(item.unit) + ')</th></tr></thead><tbody>' +
      lastRows.map((r, i) => '<tr' + (i === lastRows.length - 1 ? ' style="font-weight:700;background:var(--color-surface-alt)"' : '') + '><td>' + escapeHtml(r[0]) + '</td><td class="num">' + escapeHtml(r[1]) + '</td></tr>').join('') +
      '</tbody>';
  }
  wireItemCombobox(out, 'uc-item', refresh);
  out.querySelector('#uc-year').addEventListener('change', refresh);
  out.querySelector('#uc-excel').addEventListener('click', () => XLSX.download('QA_Report_TieuThuNam_' + todayISO() + '.xlsx', 'Tieu thu theo thang', lastHeaders, lastRows));

  await refresh();
}


/* ================= backup.js ================= */
// backup.js — full-database export/restore. Excel (.xlsx) is the primary format: one sheet per
// data store plus a cover "Thông tin" sheet, so the same file both IS the backup and can be
// opened directly in Excel to browse. .json backups from before this change are still restorable.
'use strict';

// Confirmation PIN for "Reset all data" — a deliberate-action gate against an accidental tap,
// not a real access-control mechanism (this is client-side code; treat it as such).
const RESET_PASSWORD = '1234';

const STORE_DISPLAY_NAME = {
  items: 'Danh mục hàng hóa',
  transactions: 'Giao dịch',
  stockLots: 'Lô hàng',
  stockTakes: 'Phiếu kiểm kê',
  stockTakeLines: 'Dòng kiểm kê',
  settings: 'Cài đặt',
  auditLog: 'Nhật ký thao tác'
};

// One entry per store: [fieldName, type]. type drives both how a value is written into an Excel
// cell and how it's read back — kept in one place so export/import can never drift apart.
//   text       — string, empty cell <-> ''
//   textOrNull — string, empty cell <-> null (fields the app itself treats as absent, not blank)
//   number     — numeric, empty cell <-> null
//   bool       — 'TRUE'/'FALSE' text <-> boolean
//   json       — JSON-encoded in the cell <-> parsed value (nested arrays/objects — supplierCodes,
//                picList, counters — that don't flatten into a single plain cell)
const BACKUP_SHEETS = [
  { key: 'items', fields: [
    ['id', 'text'], ['itemCode', 'text'], ['itemName', 'text'], ['category', 'text'], ['subCategory', 'text'],
    ['area', 'textOrNull'],
    ['unit', 'text'], ['location', 'text'], ['minimumStock', 'number'], ['reorderPoint', 'number'],
    ['maximumStock', 'number'], ['defaultSupplier', 'text'], ['storageCondition', 'text'],
    ['expiryControl', 'bool'], ['openedExpiryDays', 'number'], ['PIC', 'text'], ['note', 'text'],
    ['active', 'bool'], ['createdAt', 'text'], ['updatedAt', 'text'], ['supplierCodes', 'json']
  ]},
  { key: 'transactions', fields: [
    ['id', 'text'], ['transactionNo', 'text'], ['date', 'text'], ['timestamp', 'text'], ['type', 'text'],
    ['itemCode', 'text'], ['quantity', 'number'], ['unit', 'text'], ['lotNo', 'textOrNull'],
    ['expiryDate', 'textOrNull'], ['openedDate', 'textOrNull'], ['openedExpiryDate', 'textOrNull'],
    ['supplier', 'text'], ['supplierCode', 'text'], ['purpose', 'text'], ['issuedTo', 'text'],
    ['user', 'text'], ['note', 'text'], ['referenceNo', 'text'], ['createdAt', 'text']
  ]},
  { key: 'stockLots', fields: [
    ['id', 'text'], ['itemCode', 'text'], ['lotNo', 'text'], ['expiryDate', 'textOrNull'],
    ['openedDate', 'textOrNull'], ['openedExpiryDate', 'textOrNull'], ['quantity', 'number'],
    ['supplier', 'text'], ['status', 'text']
  ]},
  { key: 'stockTakes', fields: [
    ['id', 'text'], ['stockTakeNo', 'text'], ['date', 'text'], ['user', 'text'], ['status', 'text'],
    ['note', 'text'], ['createdAt', 'text'], ['completedAt', 'textOrNull']
  ]},
  { key: 'stockTakeLines', fields: [
    ['id', 'text'], ['stockTakeId', 'text'], ['itemCode', 'text'], ['systemQuantity', 'number'],
    ['physicalQuantity', 'number'], ['difference', 'number'], ['note', 'text'], ['adjustmentCreated', 'bool']
  ]},
  { key: 'settings', fields: [
    ['id', 'text'], ['appName', 'text'], ['companySite', 'text'], ['defaultUser', 'text'],
    ['dateFormat', 'text'], ['expiryWarningDays', 'number'], ['earlyWarningPercent', 'number'],
    ['theme', 'text'], ['allowNegativeStock', 'bool'], ['picList', 'json'], ['counters', 'json']
  ]},
  { key: 'auditLog', fields: [
    ['id', 'text'], ['timestamp', 'text'], ['action', 'text'], ['entity', 'text'], ['entityId', 'text'],
    ['user', 'text'], ['description', 'text']
  ]}
];

function backupFieldToCell(value, type) {
  if (type === 'number') return (value === null || value === undefined || value === '') ? '' : Number(value);
  if (type === 'bool') return value ? 'TRUE' : 'FALSE';
  if (type === 'json') return JSON.stringify(value === undefined ? null : value);
  return value === null || value === undefined ? '' : String(value);
}

function backupCellToField(raw, type) {
  const s = raw === undefined || raw === null ? '' : String(raw).trim();
  if (type === 'number') return s === '' ? null : parseFloat(s);
  if (type === 'bool') return s.toUpperCase() === 'TRUE' || s === '1';
  if (type === 'json') { if (!s) return null; try { return JSON.parse(s); } catch (e) { return null; } }
  if (type === 'textOrNull') return s === '' ? null : s;
  return s;
}

// data: the shape exportAllData() / importAllData() already use ({ items:[...], transactions:[...], ... }).
function buildBackupSheets(data, counts) {
  const meta = (data && data._meta) || {};
  const infoRows = [
    ['Ứng dụng', 'QA Stock Management'],
    ['Ngày xuất', nowISO()],
    ['Phiên bản schema', meta.schemaVersion !== undefined ? meta.schemaVersion : BACKUP_SCHEMA_VERSION],
    ...BACKUP_SHEETS.map(s => [STORE_DISPLAY_NAME[s.key] || s.key, ((data[s.key] || []).length) + ' bản ghi'])
  ];
  const sheets = [{ name: 'Thông tin', headers: ['Trường', 'Giá trị'], rows: infoRows }];
  BACKUP_SHEETS.forEach(s => {
    const headers = s.fields.map(f => f[0]);
    const rows = (data[s.key] || []).map(rec => s.fields.map(([key, type]) => backupFieldToCell(rec[key], type)));
    sheets.push({ name: STORE_DISPLAY_NAME[s.key] || s.key, headers, rows });
  });
  return sheets;
}

async function exportBackupExcel() {
  const data = await exportAllData();
  const sheets = buildBackupSheets(data);
  XLSX.downloadWorkbook('QA_Stock_Backup_' + todayISO() + '.xlsx', sheets);
}

// Reconstructs the same { items:[...], transactions:[...], ... } shape exportAllData() produces,
// from a .xlsx file built by exportBackupExcel() (or hand-edited by someone who kept the sheet
// names/headers). Refuses the file outright if none of the expected sheets are present, rather
// than silently treating a random/wrong Excel file as "an empty backup" — that would otherwise
// let a Replace restore wipe the database using a file that never was a backup.
async function parseBackupExcelFile(file) {
  const buf = await file.arrayBuffer();
  const sheetsData = XlsxReader.xlsxToObjectsBySheet(buf);
  const expectedNames = BACKUP_SHEETS.map(s => STORE_DISPLAY_NAME[s.key]);
  const matched = expectedNames.some(n => Object.prototype.hasOwnProperty.call(sheetsData, n));
  if (!matched) {
    throw new Error('File Excel này không có sheet nào khớp với định dạng sao lưu QA Stock Management (cần các sheet như "Danh mục hàng hóa", "Giao dịch"…).');
  }
  const data = { _meta: { schemaVersion: BACKUP_SCHEMA_VERSION, dbVersion: DB_VERSION, exportedAt: nowISO(), source: 'xlsx' } };
  BACKUP_SHEETS.forEach(s => {
    const rows = sheetsData[STORE_DISPLAY_NAME[s.key]] || [];
    data[s.key] = rows.map(rowObj => {
      const rec = {};
      s.fields.forEach(([key, type]) => { rec[key] = backupCellToField(rowObj[key], type); });
      return rec;
    });
  });
  return data;
}

async function renderBackup(container) {
  setPageTitle('Sao lưu & Khôi phục');

  for (const s of Object.values(STORES)) counts[s] = await dbCount(s);
  const isEmpty = counts.items === 0;
  const mode = getAppMode();
  const modeLabel = { demo: 'Demo (dữ liệu mẫu)', production: 'Production (dữ liệu thật)' }[mode] || 'Chưa xác định';

  container.innerHTML = `
    <div class="card" style="max-width:720px">
      <div class="section-title">🧪 Chế độ hoạt động</div>
      <div class="detail-grid">
        <div><div class="k">Chế độ hiện tại</div><div class="v">${escapeHtml(modeLabel)}</div></div>
      </div>
      <p class="field-hint" style="margin-top:10px">Ứng dụng chỉ hỏi chế độ Demo/Production một lần trên mỗi thiết bị và không tự nạp lại dữ liệu mẫu sau khi bạn đã xóa dữ liệu. Nút bên dưới cho phép nạp thủ công dữ liệu mẫu khi cần (chỉ hoạt động lúc kho dữ liệu đang trống).</p>
      <button class="btn btn-secondary" id="bk-load-demo" ${isEmpty ? '' : 'disabled'}>🧪 Nạp dữ liệu mẫu (Demo)</button>
      ${!isEmpty ? '<p class="field-hint">Đang có ' + counts.items + ' mặt hàng — hãy xóa toàn bộ dữ liệu trước nếu muốn nạp lại dữ liệu mẫu.</p>' : ''}
    </div>

    <div class="card" style="max-width:720px">
      <div class="section-title">💾 Sao lưu dữ liệu</div>
      <p class="field-hint">Tạo 1 file Excel (.xlsx) — mỗi loại dữ liệu 1 sheet riêng (Danh mục hàng hóa, Giao dịch, Lô hàng, Phiếu kiểm kê, Cài đặt…), kèm sheet "Thông tin" tổng quan. File này vừa dùng để khôi phục lại toàn bộ dữ liệu, vừa mở trực tiếp bằng Excel để xem/kiểm tra được ngay.</p>
      <table class="data-table" style="margin-bottom:14px"><tbody>
        ${Object.keys(counts).map(k => '<tr><td>' + (STORE_DISPLAY_NAME[k] || k) + '</td><td class="num">' + counts[k] + ' bản ghi</td></tr>').join('')}
      </tbody></table>
      <button class="btn btn-primary" id="bk-export">⭳ Xuất file sao lưu (.xlsx)</button>
    </div>

    <div class="card" style="max-width:720px">
      <div class="section-title">♻️ Khôi phục dữ liệu</div>
      <div class="info-banner warn">⚠️ Thao tác này sẽ thay thế hoặc gộp dữ liệu hiện có. Hãy chọn cẩn thận — "Thay thế" sẽ xóa vĩnh viễn dữ liệu không có trong file sao lưu.</div>
      <div class="form-field" style="margin-bottom:12px">
        <label>File sao lưu (.xlsx — file .json từ bản cũ vẫn dùng được)</label>
        <input type="file" id="bk-file" accept=".xlsx,.json">
      </div>
      <div class="form-actions" style="justify-content:flex-start">
        <button class="btn btn-secondary" id="bk-merge" disabled>Gộp dữ liệu</button>
        <button class="btn btn-danger" id="bk-replace" disabled>Thay thế toàn bộ</button>
      </div>
    </div>

    <div class="card" style="max-width:720px">
      <div class="section-title">🧨 Xóa dữ liệu (có kiểm soát)</div>
      <p class="field-hint">Chỉ dành cho quản trị viên. Xóa vĩnh viễn toàn bộ dữ liệu cục bộ. Thao tác này không ảnh hưởng đến file Excel gốc.</p>
      <button class="btn btn-danger" id="bk-reset">Xóa toàn bộ dữ liệu cục bộ</button>
    </div>
  `;

  const loadDemoBtn = container.querySelector('#bk-load-demo');
  if (loadDemoBtn) loadDemoBtn.addEventListener('click', async () => {
    const ok = await confirmModal('Nạp dữ liệu mẫu (Demo) vào kho dữ liệu đang trống?', { okLabel: 'Nạp dữ liệu mẫu' });
    if (!ok) return;
    const seeded = await seedIfEmpty();
    setAppMode('demo');
    toast(seeded ? 'Đã nạp dữ liệu mẫu.' : 'Kho dữ liệu không còn trống — không nạp lại.', seeded ? 'success' : 'error');
    renderBackup(container);
  });

  container.querySelector('#bk-export').addEventListener('click', async () => {
    try {
      await exportBackupExcel();
      await logAudit('EXPORT_BACKUP', 'system', 'backup', (await getSettings()).defaultUser, 'Đã xuất file sao lưu đầy đủ (Excel)');
      toast('Đã xuất file sao lưu.', 'success');
    } catch (err) {
      toast('Xuất file sao lưu thất bại: ' + err.message, 'error');
    }
  });

  let pendingData = null;
  container.querySelector('#bk-file').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    pendingData = null;
    container.querySelector('#bk-merge').disabled = true;
    container.querySelector('#bk-replace').disabled = true;
    if (!file) return;
    if (/\.xlsx$/i.test(file.name)) {
      try {
        pendingData = await parseBackupExcelFile(file);
        container.querySelector('#bk-merge').disabled = false;
        container.querySelector('#bk-replace').disabled = false;
        toast('Đã tải file sao lưu. Hãy chọn Gộp dữ liệu hoặc Thay thế toàn bộ.', 'success');
      } catch (err) {
        toast('Không đọc được file Excel: ' + err.message, 'error');
      }
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      try {
        pendingData = JSON.parse(reader.result);
        container.querySelector('#bk-merge').disabled = false;
        container.querySelector('#bk-replace').disabled = false;
        toast('Đã tải file sao lưu. Hãy chọn Gộp dữ liệu hoặc Thay thế toàn bộ.', 'success');
      } catch (err) {
        toast('File JSON không hợp lệ: ' + err.message, 'error');
      }
    };
    reader.readAsText(file, 'UTF-8');
  });

  container.querySelector('#bk-merge').addEventListener('click', async () => {
    if (!pendingData) return;
    const ok = await confirmModal('Gộp file sao lưu vào dữ liệu hiện tại?\nCác bản ghi trùng ID sẽ bị ghi đè bởi dữ liệu sao lưu; phần còn lại được giữ nguyên.', { okLabel: 'Gộp dữ liệu' });
    if (!ok) return;
    try {
      await importAllData(pendingData, 'merge');
      await logAudit('RESTORE', 'system', 'backup', (await getSettings()).defaultUser, 'Đã khôi phục sao lưu (gộp dữ liệu)');
      toast('Đã gộp dữ liệu sao lưu.', 'success');
      renderBackup(container);
    } catch (err) {
      toast('Khôi phục thất bại: ' + err.message, 'error');
    }
  });
  container.querySelector('#bk-replace').addEventListener('click', async () => {
    if (!pendingData) return;
    const ok = await confirmModal('Thay thế TOÀN BỘ dữ liệu hiện tại bằng file sao lưu này?\nMọi dữ liệu không có trong file sẽ bị xóa vĩnh viễn.', { danger: true, okLabel: 'Thay thế toàn bộ' });
    if (!ok) return;
    try {
      await importAllData(pendingData, 'replace');
      await logAudit('RESTORE', 'system', 'backup', (await getSettings()).defaultUser, 'Đã khôi phục sao lưu (thay thế toàn bộ)');
      toast('Đã khôi phục dữ liệu (thay thế toàn bộ).', 'success');
      renderBackup(container);
    } catch (err) {
      toast('Khôi phục thất bại: ' + err.message, 'error');
    }
  });

  container.querySelector('#bk-reset').addEventListener('click', async () => {
    const ok = await confirmModal('Thao tác này sẽ xóa vĩnh viễn TOÀN BỘ dữ liệu cục bộ (mặt hàng, giao dịch, lô hàng, phiếu kiểm kê, cài đặt) và khởi động lại ứng dụng như lần cài đặt đầu tiên. Không thể hoàn tác trừ khi bạn đã có bản sao lưu.\n\nBấm Tiếp tục để nhập mật khẩu xác nhận.', { danger: true, okLabel: 'Tiếp tục' });
    if (!ok) return;
    const pw = await promptPassword('Xác nhận Reset dữ liệu', 'Nhập mật khẩu để xác nhận xóa toàn bộ dữ liệu và bắt đầu ứng dụng từ đầu.');
    if (pw === null) return;
    if (pw !== RESET_PASSWORD) { toast('Mật khẩu không đúng — đã hủy thao tác Reset.', 'error'); return; }
    await clearAllData(); // clears auditLog too, so there is deliberately no audit entry logged for this action
    setAppMode(null); // forget the Demo/Production decision too — truly start over, not just empty data
    toast('Đã xóa toàn bộ dữ liệu. Đang khởi động lại ứng dụng…', 'success');
    setTimeout(() => location.reload(), 800);
  });
}

// settings.js — app configuration (single settings row).
'use strict';

async function renderSettings(container) {

          <div class="form-field"><label>Người dùng mặc định</label><input type="text" name="defaultUser" value="${escapeHtml(s.defaultUser || '')}"></div>

          </div>
          <div class="form-field"><label>Số ngày cảnh báo hết hạn</label>
            <select name="expiryWarningDays">${[7, 14, 30, 60].map(d => '<option value="' + d + '" ' + (s.expiryWarningDays === d ? 'selected' : '') + '>' + d + ' ngày</option>').join('')}</select>
          </div>

          </div>

        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">✓ Lưu cài đặt</button>
        </div>
      </form>
    </div>

    <div class="card" style="max-width:640px">
      <div class="section-title">👤 Danh sách người thực hiện (PIC)</div>
      <p class="field-hint">Dùng cho ô "Người thực hiện" ở Nhập kho, Xuất kho, Điều chỉnh — chọn nhanh từ danh sách, tránh gõ sai chính tả làm phân mảnh báo cáo. Vẫn có thể chọn "➕ Khác…" ở các form đó để dùng một tên chưa có ở đây.</p>

      </div>
    </div>

      <div class="section-title">🩺 Kiểm tra tính toàn vẹn dữ liệu</div>

      <div id="integrity-result" style="margin-top:14px"></div>
    </div>

    navigator.serviceWorker.getRegistration().then(reg => {
      container.querySelector('#settings-sw').textContent = reg ? 'Đã đăng ký (bộ nhớ đệm offline đang hoạt động)' : 'Chưa đăng ký';
    });

    container.querySelector('#settings-sw').textContent = 'Trình duyệt không hỗ trợ';
  }

  container.querySelector('#settings-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    await saveSettings({
      appName: fd.get('appName'), companySite: fd.get('companySite'), defaultUser: fd.get('defaultUser'),
      dateFormat: fd.get('dateFormat'), expiryWarningDays: parseInt(fd.get('expiryWarningDays'), 10),
      earlyWarningPercent: parseInt(fd.get('earlyWarningPercent'), 10),

  });

  renderPicRows(container, s.picList || []);

    const current = (await getSettings()).picList || [];

    renderPicRows(container, updated.picList);
    toast('Đã thêm vào danh sách.', 'success');
  });

  container.querySelector('#settings-run-check').addEventListener('click', async () => {
    const btn = container.querySelector('#settings-run-check');
    const out = container.querySelector('#integrity-result');
    btn.disabled = true;
    out.innerHTML = '<p>Đang kiểm tra…</p>';
    try {

      renderIntegrityResult(out, result);

      out.innerHTML = '<div class="info-banner danger">Kiểm tra thất bại: ' + escapeHtml(err.message) + '</div>';
    } finally {
      btn.disabled = false;
    }
  });
}

function renderPicRows(container, picList) {
  const body = container.querySelector('#pic-list-body');
  body.innerHTML = picList.length ? picList.map(name =>
    '<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--color-border)">' +
    '<span>' + escapeHtml(name) + '</span>' +
    '<button type="button" class="btn btn-ghost btn-xs" data-pic-remove="' + escapeHtml(name) + '">✕ Xóa</button>' +
    '</div>'
  ).join('') : '<p class="field-hint">Chưa có tên nào — thêm bên dưới.</p>';
  body.querySelectorAll('[data-pic-remove]').forEach(btn => btn.addEventListener('click', async () => {
    const updated = await saveSettings({ picList: picList.filter(n => n !== btn.dataset.picRemove) });
    renderPicRows(container, updated.picList);
    toast('Đã xóa khỏi danh sách.', 'success');
  }));
}

function renderIntegrityResult(out, result) {
  const banner = result.ok
    ? '<div class="info-banner">✅ Không phát hiện lỗi. ' + (result.warningCount ? result.warningCount + ' cảnh báo cần xem xét.' : 'Dữ liệu nhất quán.') + '</div>'
    : '<div class="info-banner danger">❌ Phát hiện ' + result.errorCount + ' lỗi và ' + result.warningCount + ' cảnh báo.</div>';

  out.innerHTML = banner +
    '<p class="field-hint">Đã kiểm tra: ' + result.counts.items + ' mặt hàng, ' + result.counts.transactions + ' giao dịch, ' +
    result.counts.lots + ' lô hàng, ' + result.counts.stockTakes + ' phiếu kiểm kê · lúc ' + fmtDateTime(result.checkedAt) + '</p>' +
    (result.issues.length ? '<div class="table-wrap"><table class="data-table"><thead><tr><th>Mức độ</th><th>Mã hàng</th><th>Chi tiết</th></tr></thead><tbody>' +
      result.issues.map(i => '<tr><td>' + (i.severity === 'ERROR' ? '<span class="badge badge-out">Lỗi</span>' : '<span class="badge badge-reorder">Cảnh báo</span>') + '</td>' +
        '<td>' + escapeHtml(i.itemCode || '—') + '</td><td>' + escapeHtml(i.message) + '</td></tr>').join('') +
      '</tbody></table></div>' : '');
}


/* ================= router.js ================= */
// router.js — minimal hash router.
'use strict';

const ROUTES = {
  'dashboard': (c, q) => renderDashboard(c, q),
  'inventory': (c, q) => renderInventory(c, q),
  'stock-in': (c, q) => renderStockIn(c, q),
  'stock-out': (c, q) => renderStockOut(c, q),
  'stock-take': (c, q, rest) => renderStockTakeRoute(c, q, rest),
  'master-data': (c, q) => renderMasterData(c, q),
  'transactions': (c, q) => renderTransactions(c, q),
  'alerts': (c, q) => renderAlerts(c, q),
  'reports': (c, q, rest) => renderReports(c, q, rest && rest[0]),
  'backup': (c, q) => renderBackup(c, q),
  'guide': (c, q) => renderGuide(c, q),
  'settings': (c, q) => renderSettings(c, q),
  'item': (c, q, rest) => renderItemDetail(c, q, rest && rest[0])
};

function parseHash() {
  let hash = location.hash || '#/dashboard';
  hash = hash.replace(/^#\/?/, '');
  const [pathPart, queryPart] = hash.split('?');
  const segments = pathPart.split('/').filter(Boolean);
  const route = segments[0] || 'dashboard';
  const rest = segments.slice(1);
  return { route, rest, query: queryPart || '' };
}

async function handleRoute() {
  const { route, rest, query } = parseHash();
  const container = document.getElementById('app-content');
  const handler = ROUTES[route];

  document.querySelectorAll('#nav-list a').forEach(a => a.classList.toggle('active', a.dataset.route === route));
  closeNavDrawer();

  if (!handler) {
    container.innerHTML = '<div class="card"><h2>Không tìm thấy trang</h2><a class="btn btn-primary" href="#/dashboard">Về Tổng quan</a></div>';
    return;
  }
  try {
    await handler(container, query, rest);
  } catch (err) {
    console.error(err);
    container.innerHTML = '<div class="card"><h2>Đã xảy ra lỗi</h2><p>' + escapeHtml(err.message) + '</p></div>';
  }
  if (typeof updateAlarmBadge === 'function') updateAlarmBadge();
}

function closeNavDrawer() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('nav-scrim').classList.remove('open');
}

function initRouter() {
  window.addEventListener('hashchange', handleRoute);
  handleRoute();
}

// app.js — bootstrap: DB init, seed data, service worker, nav wiring, router start.
'use strict';

function updateConnStatus() {
  const el = document.getElementById('conn-status');
  if (!el) return;
  if (navigator.onLine) { el.textContent = '● ONLINE'; el.classList.remove('offline'); }
  else { el.textContent = '● OFFLINE'; el.classList.add('offline'); }
}

function wireNav() {
  const toggle = document.getElementById('nav-toggle');
  const sidebar = document.getElementById('sidebar');
  const scrim = document.getElementById('nav-scrim');
  toggle.addEventListener('click', () => {
    sidebar.classList.toggle('open');
    scrim.classList.toggle('open');
  });
  scrim.addEventListener('click', closeNavDrawer);
}

function wireQuickActions() {
  document.getElementById('quick-stock-in').addEventListener('click', () => openStockInModal(null, refreshCurrentRoute));
  document.getElementById('quick-stock-out').addEventListener('click', () => openStockOutModal(null, refreshCurrentRoute));
}

function refreshCurrentRoute() {
  handleRoute();
}

// Decides once (per browser/device) whether this install starts with sample data (Demo) or
// empty (Production), and never auto-reseeds afterwards — including after an explicit
// "Clear All Local Data". See js/backup.js for the manual "load sample data" action that
// remains available afterwards for anyone who deliberately wants the demo dataset back.
async function ensureAppMode() {
  const existingMode = getAppMode();
  if (existingMode) return; // already decided on this device — never ask again, never auto-reseed

  const itemCount = await dbCount(STORES.items);
  if (itemCount > 0) {
    // Upgrading from a version before this feature existed: data already present, infer Production.
    setAppMode('production');
    return;
  }

  const choice = await new Promise((resolve) => {
    const overlay = openModal(
      modalHeader('Bắt đầu sử dụng QA Stock Management') +
      '<p>Đây là lần đầu ứng dụng chạy trên thiết bị này. Bạn muốn bắt đầu như thế nào?</p>' +
      '<div class="form-actions" style="justify-content:flex-start;flex-direction:column;align-items:stretch;gap:10px">' +
      '<button class="btn btn-primary btn-block" data-choice="demo" style="white-space:normal;text-align:left;height:auto;padding:12px 16px;line-height:1.4">🧪 Dùng dữ liệu mẫu (Demo)<br><span style="font-weight:400;font-size:12px">Nạp sẵn danh mục và lịch sử giao dịch mẫu để khám phá tính năng.</span></button>' +
      '<button class="btn btn-secondary btn-block" data-choice="production" style="white-space:normal;text-align:left;height:auto;padding:12px 16px;line-height:1.4">🏭 Bắt đầu trống (Production)<br><span style="font-weight:400;font-size:12px">Không nạp dữ liệu mẫu — bạn tự thêm danh mục hàng hóa thật của nhà máy.</span></button>' +
      '</div>',
      { persistent: true }
    );
    overlay.querySelectorAll('[data-choice]').forEach(btn => btn.addEventListener('click', () => {
      const mode = btn.dataset.choice;
      closeModal(overlay);
      resolve(mode);
    }));
  });

  setAppMode(choice);
  if (choice === 'demo') await seedIfEmpty();
}

async function bootstrap() {
  try {
    await openDB();
    await ensureAppMode();
  } catch (err) {
    console.error('Database init failed', err);
    document.getElementById('app-content').innerHTML =
      '<div class="card"><h2>Lỗi cơ sở dữ liệu</h2><p>' + escapeHtml(err.message) + '</p></div>';
    return;
  }

  wireNav();
  wireQuickActions();
  updateConnStatus();
  window.addEventListener('online', updateConnStatus);
  window.addEventListener('offline', updateConnStatus);

  initRouter();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js').catch(err => console.warn('SW registration failed', err));
  }
}

document.addEventListener('DOMContentLoaded', bootstrap);

</script>
</body>
</html>
