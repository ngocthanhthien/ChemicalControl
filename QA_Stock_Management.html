// item-detail.js — single item view: info, stock, lots, history, quick actions, QR.
'use strict';

async function renderItemDetail(container, params, itemCode) {
  const item = await getItemByCode(decodeURIComponent(itemCode));
  if (!item) {
    container.innerHTML = '<div class="card"><p>Không tìm thấy mặt hàng.</p><a class="btn btn-secondary" href="#/inventory">← Quay lại Tồn kho</a></div>';
    setPageTitle('Không tìm thấy mặt hàng');
    return;
  }
  setPageTitle(item.itemCode + ' — ' + item.itemName);

  const [balance, lots, txs, settings] = await Promise.all([
    getBalance(item.itemCode), getLotsForItem(item.itemCode), getTransactionsForItem(item.itemCode), getSettings()
  ]);
  const status = computeStockStatus(balance, item.minimumStock, item.reorderPoint);
  const consumption = computeConsumption(txs, balance, 90);
  const recommendedQty = recommendedOrderQty(item, balance);
  const decreaseDisabled = balance <= 0 && !settings.allowNegativeStock;

  lots.sort((a, b) => {
    const ea = effectiveExpiry(a), eb = effectiveExpiry(b);
    if (!ea && !eb) return 0; if (!ea) return 1; if (!eb) return -1;
    return ea < eb ? -1 : ea > eb ? 1 : 0;
  });

  container.innerHTML = `
    <div class="quick-actions">
      <a class="btn btn-secondary btn-sm" href="#/inventory">← Quay lại</a>
      <button class="btn btn-primary btn-sm" data-action="stock-in">➕ Nhập kho</button>
      <button class="btn btn-danger btn-sm" data-action="stock-out" ${decreaseDisabled ? 'disabled' : ''}>➖ Xuất kho</button>
      <button class="btn btn-secondary btn-sm" data-action="adjustment">🛠 Điều chỉnh</button>
      <button class="btn btn-secondary btn-sm" data-action="disposal" ${balance <= 0 ? 'disabled' : ''}>🗑 Hủy bỏ</button>
      <button class="btn btn-secondary btn-sm" data-action="edit-item">✏️ Sửa thông tin</button>
      <button class="btn btn-ghost btn-sm" data-action="show-qr">▦ Mã QR</button>
    </div>

    <div class="card">
      <div class="section-title">Thông tin cơ bản</div>
      <div class="detail-grid">
        <div><div class="k">Mã hàng</div><div class="v">${escapeHtml(item.itemCode)}</div></div>
        <div><div class="k">Tên hóa chất/hàng hóa</div><div class="v">${escapeHtml(item.itemName)}</div></div>
        <div><div class="k">Nhóm hàng</div><div class="v">${categoryLabel(item.category)}</div></div>
        <div><div class="k">Khu vực</div><div class="v">${item.area ? areaLabel(item.area) : '—'}</div></div>
        <div><div class="k">Đơn vị tính</div><div class="v">${escapeHtml(item.unit)}</div></div>
        <div><div class="k">Vị trí</div><div class="v">${escapeHtml(item.location || '—')}</div></div>
        <div><div class="k">Nhà cung cấp mặc định</div><div class="v">${escapeHtml(item.defaultSupplier || '—')}</div></div>
        <div><div class="k">Điều kiện bảo quản</div><div class="v">${escapeHtml(item.storageCondition || '—')}</div></div>
        <div><div class="k">Người phụ trách (PIC)</div><div class="v">${escapeHtml(item.PIC || '—')}</div></div>
        <div><div class="k">Hạn dùng sau mở (ngày)</div><div class="v">${item.openedExpiryDays || '—'}</div></div>
        <div><div class="k">Trạng thái</div><div class="v">${item.active === false ? '<span class="badge badge-neutral">Ngừng dùng</span>' : '<span class="badge badge-normal">Đang dùng</span>'}</div></div>
      </div>
      ${item.note ? '<p style="margin-top:10px" class="field-hint">Ghi chú: ' + escapeHtml(item.note) + '</p>' : ''}
    </div>

    <div class="card">
      <div class="section-title">Tồn kho</div>
      <div class="detail-grid">
        <div><div class="k">Tồn hiện tại</div><div class="v" style="font-size:20px">${fmtNum(balance)} ${escapeHtml(item.unit)}</div></div>
        <div><div class="k">Trạng thái</div><div class="v">${statusBadge(status)}</div></div>
        <div><div class="k">Tồn tối thiểu</div><div class="v">${fmtNum(item.minimumStock)}</div></div>
        <div><div class="k">Ngưỡng đặt hàng</div><div class="v">${fmtNum(item.reorderPoint)}</div></div>
        <div><div class="k">Tồn tối đa</div><div class="v">${item.maximumStock !== undefined && item.maximumStock !== null ? fmtNum(item.maximumStock) : '—'}</div></div>
        <div><div class="k">Số lượng đề xuất đặt hàng</div><div class="v">${recommendedQty !== null ? fmtNum(recommendedQty) : '—'}</div></div>
      </div>
      <hr style="margin:14px 0;border:none;border-top:1px solid var(--color-border)">
      <div class="detail-grid">
        <div><div class="k">Tiêu thụ TB/ngày (90 ngày)</div><div class="v">${consumption.avgDaily.toFixed(3)} ${escapeHtml(item.unit)}/ngày</div></div>
        <div><div class="k">Tiêu thụ TB/tháng</div><div class="v">${consumption.avgMonthly.toFixed(2)} ${escapeHtml(item.unit)}/tháng</div></div>
        <div><div class="k">Số ngày tồn kho còn đủ dùng</div><div class="v">${consumption.coverageDays !== null ? consumption.coverageDays + ' ngày' : '—'}</div></div>
        <div><div class="k">Ngày dự kiến hết hàng</div><div class="v">${consumption.estimatedStockoutDate ? fmtDate(consumption.estimatedStockoutDate) : '—'}</div></div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">Thông tin lô hàng</div>
      <div class="table-wrap"><table class="data-table">
        <thead><tr><th>Số lô</th><th class="num">SL</th><th>Hạn dùng</th><th>Ngày mở</th><th>Hạn dùng sau mở</th><th>Trạng thái</th><th>Sửa</th></tr></thead>
        <tbody>${lots.length ? lots.map(l => lotRowHtml(l, settings.expiryWarningDays)).join('') : emptyRow(7, 'Chưa có lô hàng nào.')}</tbody>
      </table></div>
    </div>

    <div class="card">
      <div class="section-title">Lịch sử giao dịch</div>
      <div class="table-wrap"><table class="data-table">
        <thead><tr><th>Ngày</th><th>Loại</th><th class="num">SL</th><th>Số lô</th><th>Người thực hiện</th><th>Ghi chú / Mục đích</th><th>Sửa</th></tr></thead>
        <tbody>${txs.length ? txs.map(t => txRowHtml(t)).join('') : emptyRow(7, 'Chưa có giao dịch nào.')}</tbody>
      </table></div>
    </div>
  `;

  container.querySelector('[data-action="stock-in"]').addEventListener('click', () => openStockInModal(item.itemCode, refresh));
  container.querySelector('[data-action="stock-out"]').addEventListener('click', () => openStockOutModal(item.itemCode, refresh));
  container.querySelector('[data-action="adjustment"]').addEventListener('click', () => openAdjustmentModal(item.itemCode, refresh));
  container.querySelector('[data-action="disposal"]').addEventListener('click', () => openDisposalModal(item.itemCode, refresh));
  container.querySelector('[data-action="edit-item"]').addEventListener('click', () => openItemFormModal(item, refresh));
  container.querySelector('[data-action="show-qr"]').addEventListener('click', () => showQrModal(item));

  container.querySelectorAll('[data-edit-lot]').forEach(btn => btn.addEventListener('click', () => {
    const lot = lots.find(l => l.id === btn.dataset.editLot);
    if (lot) openEditLotModal(lot, refresh);
  }));
  container.querySelectorAll('[data-fix-qty]').forEach(btn => btn.addEventListener('click', () => {
    openAdjustmentModal(item.itemCode, refresh, btn.dataset.fixQty);
  }));
  container.querySelectorAll('[data-edit-tx]').forEach(btn => btn.addEventListener('click', () => {
    const t = txs.find(x => x.id === btn.dataset.editTx);
    if (t) openEditTxModal(t, settings.picList, refresh);
  }));

  function refresh() { renderItemDetail(container, params, itemCode); }
}

function lotRowHtml(l, warningDays) {
  const expStatus = computeExpiryStatus(l, warningDays);
  return '<tr><td>' + escapeHtml(l.lotNo) + '</td><td class="num">' + fmtNum(l.quantity) + '</td>' +
    '<td>' + (l.expiryDate ? fmtDate(l.expiryDate) : '—') + '</td>' +
    '<td>' + (l.openedDate ? fmtDate(l.openedDate) : '—') + '</td>' +
    '<td>' + (l.openedExpiryDate ? fmtDate(l.openedExpiryDate) : '—') + '</td>' +
    '<td>' + (l.status === 'ACTIVE' ? expiryBadge(expStatus) : '<span class="badge badge-neutral">' + l.status + '</span>') + '</td>' +
    '<td><button type="button" class="btn btn-ghost btn-xs" data-edit-lot="' + l.id + '" title="Sửa số lô / hạn dùng / NCC">✏️</button> ' +
    '<button type="button" class="btn btn-ghost btn-xs" data-fix-qty="' + escapeHtml(l.lotNo) + '" title="Sửa số lượng (qua Điều chỉnh)">🛠</button></td></tr>';
}

function txRowHtml(t) {
  return '<tr><td>' + fmtDate(t.date) + '</td><td>' + (TX_TYPE_LABEL[t.type] || t.type) + '</td>' +
    '<td class="num">' + (t.type === 'ADJUSTMENT' && t.quantity > 0 ? '+' : '') + fmtNum(t.quantity) + '</td>' +
    '<td>' + escapeHtml(t.lotNo || '—') + '</td><td>' + escapeHtml(t.user || '') + '</td>' +
    '<td>' + escapeHtml(t.purpose || t.note || '') + '</td>' +
    '<td><button type="button" class="btn btn-ghost btn-xs" data-edit-tx="' + t.id + '" title="Sửa PO / mã NCC / ghi chú / người thực hiện">✏️</button></td></tr>';
}

function openEditLotModal(lot, onSuccess) {
  openMetadataEditModal('✏️ Sửa thông tin lô ' + lot.lotNo, [
    { name: 'lotNo', label: 'Số lô' },
    { name: 'expiryDate', label: 'Hạn dùng', type: 'date' },
    { name: 'supplier', label: 'Nhà cung cấp' }
  ], lot, async (patch, reason) => {
    await updateLotMetadata(lot.id, patch, reason);
    toast('Đã cập nhật thông tin lô.', 'success');
    onSuccess();
  });
}

function openEditTxModal(t, picList, onSuccess) {
  openMetadataEditModal('✏️ Sửa thông tin giao dịch ' + t.transactionNo, [
    { name: 'referenceNo', label: 'Số tham chiếu (PO)' },
    { name: 'supplierCode', label: 'Mã hàng của NCC' },
    { name: 'user', label: 'Người thực hiện', type: 'pic', picList },
    { name: 'note', label: 'Ghi chú', full: true }
  ], t, async (patch, reason) => {
    await updateTransactionMetadata(t.id, patch, reason);
    toast('Đã cập nhật thông tin giao dịch.', 'success');
    onSuccess();
  });
}

function showQrModal(item) {
  const overlay = openModal(modalHeader('Mã QR — ' + item.itemCode) +
    '<div class="qr-box"><canvas id="qr-canvas"></canvas>' +
    '<div><p style="margin:0 0 6px"><strong>' + escapeHtml(item.itemCode) + '</strong></p>' +
    '<p class="field-hint" style="margin:0">' + escapeHtml(item.itemName) + '</p>' +
    '<p class="field-hint">Mã hóa mã hàng — dùng để in dán lên kệ/tủ nhận diện nhanh.</p></div></div>' +

  } catch (e) {
    overlay.querySelector('#qr-canvas').replaceWith(document.createTextNode('Tạo mã QR thất bại: ' + e.message));
  }
}

async function wireStockInForm(root, onSuccess, closeFn) {
  const form = root.querySelector('#stock-in-form');
  const unitField = form.querySelector('[name="unit"]');
  const supplierCodeList = form.querySelector('#stock-in-supplier-codes');
  wirePicField(form, 'receivedBy');

  async function syncUnit(code) {
    const item = code ? await getItemByCode(code) : null;
    unitField.value = item ? item.unit : '';
    form.querySelector('[data-lot-req]').style.display = item && item.expiryControl ? '' : 'none';
    const codes = (item && item.supplierCodes) || [];
    supplierCodeList.innerHTML = codes.map(c => '<option value="' + escapeHtml(c.code) + '">' + escapeHtml(c.supplier || '') + '</option>').join('');
  }
  wireItemCombobox(form, 'itemCode', syncUnit);
  syncUnit(form.querySelector('[name="itemCode"]').value);

  form.querySelector('[data-cancel]').addEventListener('click', () => closeFn && closeFn());

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearFieldErrors(form);
    const fd = new FormData(form);
    const itemCode = fd.get('itemCode');
    const quantity = parseFloat(fd.get('quantity'));
    const date = fd.get('date');
    const lotNo = (fd.get('lotNo') || '').trim();
    const expiryDate = fd.get('expiryDate') || null;
    const receivedBy = picFieldValue(form, 'receivedBy');
    const supplier = (fd.get('supplier') || '').trim();
    const supplierCode = (fd.get('supplierCode') || '').trim();

    let hasError = false;
    if (!itemCode) { fieldError(form, 'itemCode', 'Vui lòng chọn mặt hàng.'); hasError = true; }
    if (!date) { fieldError(form, 'date', 'Vui lòng nhập ngày.'); hasError = true; }
    if (!(quantity > 0)) { fieldError(form, 'quantity', 'Số lượng phải lớn hơn 0.'); hasError = true; }
    const item = itemCode ? await getItemByCode(itemCode) : null;
    if (item && item.expiryControl && !lotNo) { fieldError(form, 'lotNo', 'Mặt hàng này bắt buộc phải nhập số lô.'); hasError = true; }
    if (expiryDate && expiryDate < date) { fieldError(form, 'expiryDate', 'Hạn dùng không được sớm hơn ngày nhập kho.'); hasError = true; }
    if (hasError) return;

    const submitBtn = form.querySelector('[type="submit"]');
    submitBtn.disabled = true;
    try {
      await postTransaction({
        type: 'IN', date, itemCode, quantity, unit: item.unit,
        lotNo: lotNo || null, expiryDate,
        supplier, supplierCode, referenceNo: fd.get('referenceNo'),
        note: fd.get('note'), user: receivedBy
      }, receivedBy);
      // Learn new supplier+code combos onto the item's reference list for next time — only when
      // both are given and it's not already there, so the list doesn't fill up with blanks.
      if (supplier && supplierCode && item) {
        const known = item.supplierCodes || [];
        const exists = known.some(c => c.supplier === supplier && c.code === supplierCode);
        if (!exists) {
          await saveItem({ ...item, supplierCodes: [...known, { supplier, code: supplierCode, note: '' }] }, receivedBy);
        }
      }
      toast('Đã lưu phiếu Nhập kho cho ' + itemCode + '.', 'success');
      if (closeFn) closeFn();
      if (onSuccess) onSuccess();
    } catch (err) {
      toast('Lỗi: ' + err.message, 'error');
    } finally {
      submitBtn.disabled = false;
    }
  });
}

async function renderStockIn(container, params) {

async function wireStockOutForm(root, onSuccess, closeFn) {
  const form = root.querySelector('#stock-out-form');
  const lotSelect = form.querySelector('[name="lotNo"]');
  const balanceBanner = root.querySelector('#stock-out-balance');
  const fefoBanner = root.querySelector('#stock-out-fefo');
  let currentBalance = 0;
  let currentLots = [];
  let allowNegative = false;
  wirePicField(form, 'issuedBy');

  async function syncItem(code) {
    lotSelect.innerHTML = '<option value="">— Không theo dõi lô —</option>';
    balanceBanner.style.display = 'none';
    fefoBanner.style.display = 'none';
    if (!code) return;
    const settings = await getSettings();
    allowNegative = !!settings.allowNegativeStock;
    currentBalance = await getBalance(code);
    currentLots = await getLotsForItem(code);
    balanceBanner.style.display = '';
    balanceBanner.className = 'info-banner' + (currentBalance <= 0 ? ' danger' : '');
    balanceBanner.textContent = 'Tồn hiện tại: ' + fmtNum(currentBalance) + ' — có sẵn trong ' + currentLots.filter(l => l.quantity > 0 && l.status !== 'DISPOSED').length + ' lô đang hoạt động.';

    const activeLots = currentLots.filter(l => l.quantity > 0 && l.status !== 'DISPOSED' && l.status !== 'DEPLETED');
    if (activeLots.length) {
      const rec = recommendFefoLot(activeLots);
      activeLots.sort((a, b) => {
        const ea = effectiveExpiry(a), eb = effectiveExpiry(b);
        if (!ea && !eb) return 0; if (!ea) return 1; if (!eb) return -1;
        return ea < eb ? -1 : ea > eb ? 1 : 0;
      });
      activeLots.forEach(l => {
        const opt = document.createElement('option');
        opt.value = l.lotNo;
        const exp = effectiveExpiry(l);
        opt.textContent = l.lotNo + ' — SL ' + fmtNum(l.quantity) + (exp ? ' — HSD ' + fmtDate(exp) : '') + (l.lotNo === rec.lotNo ? ' (đề xuất FEFO)' : '');
        lotSelect.appendChild(opt);
      });
      lotSelect.value = rec.lotNo;
      fefoBanner.style.display = '';
      fefoBanner.textContent = '📋 FEFO — Hết hạn trước, xuất trước: lô đề xuất ' + rec.lotNo + (effectiveExpiry(rec) ? ' — hết hạn ' + fmtDate(effectiveExpiry(rec)) : '') + '. Bạn có thể chọn lô khác, nhưng sẽ cần xác nhận lại.';
    }
  }
  wireItemCombobox(form, 'itemCode', syncItem);
  syncItem(form.querySelector('[name="itemCode"]').value);

  lotSelect.addEventListener('change', () => {
    const lot = currentLots.find(l => l.lotNo === lotSelect.value);
    if (!lot) return;
    const expStatus = lot.expiryDate || lot.openedExpiryDate ? computeExpiryStatus(lot, 30) : 'NORMAL';
    if (expStatus === 'EXPIRED') toast('Cảnh báo: lô ' + lot.lotNo + ' đã HẾT HẠN.', 'error');
  });

  form.querySelector('[data-cancel]').addEventListener('click', () => closeFn && closeFn());

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearFieldErrors(form);
    const fd = new FormData(form);
    const itemCode = fd.get('itemCode');
    const quantity = parseFloat(fd.get('quantity'));
    const date = fd.get('date');
    const lotNo = fd.get('lotNo') || null;

    let hasError = false;
    if (!itemCode) { fieldError(form, 'itemCode', 'Vui lòng chọn mặt hàng.'); hasError = true; }
    if (!date) { fieldError(form, 'date', 'Vui lòng nhập ngày.'); hasError = true; }
    if (!(quantity > 0)) { fieldError(form, 'quantity', 'Số lượng phải lớn hơn 0.'); hasError = true; }
    if (hasError) return;

    const item = await getItemByCode(itemCode);
    const balance = await getBalance(itemCode);
    if (!allowNegative && quantity > balance + 1e-9) {
      fieldError(form, 'quantity', 'Không đủ tồn kho — chỉ còn ' + fmtNum(balance) + '.');
      toast('Xuất kho bị chặn: số lượng vượt quá tồn kho hiện có.', 'error');
      return;
    }
    const hasActiveLots = currentLots.some(l => l.quantity > 0 && l.status !== 'DISPOSED' && l.status !== 'DEPLETED');
    if (item.expiryControl && hasActiveLots && !lotNo) {
      fieldError(form, 'lotNo', 'Mặt hàng này theo dõi lô — vui lòng chọn số lô để đảm bảo nguyên tắc FEFO.');
      return;
    }
    let lot = null;
    if (lotNo) {
      lot = currentLots.find(l => l.lotNo === lotNo);
      if (lot && !allowNegative && quantity > lot.quantity + 1e-9) {
        fieldError(form, 'lotNo', 'Không đủ tồn trong lô này — chỉ còn ' + fmtNum(lot.quantity) + '.');
        return;
      }
      if (lot) {
        const activeLots = currentLots.filter(l => l.quantity > 0 && l.status !== 'DISPOSED' && l.status !== 'DEPLETED');
        const rec = recommendFefoLot(activeLots);
        const expStatus = computeExpiryStatus(lot, 30);
        if (expStatus === 'EXPIRED') {
          const ok = await confirmModal('Lô ' + lot.lotNo + ' đã HẾT HẠN. Bạn vẫn muốn xuất từ lô này?', { danger: true, okLabel: 'Vẫn xuất' });
          if (!ok) return;
        } else if (rec && rec.lotNo !== lot.lotNo) {
          const ok = await confirmModal('Thao tác này bỏ qua đề xuất FEFO (lô ' + rec.lotNo + ', hết hạn ' + fmtDate(effectiveExpiry(rec)) + '). Tiếp tục với lô ' + lot.lotNo + '?', { okLabel: 'Tiếp tục' });
          if (!ok) return;
        }
      }
    }

    const issuedBy = picFieldValue(form, 'issuedBy');
    const submitBtn = form.querySelector('[type="submit"]');
    submitBtn.disabled = true;
    try {
      await postTransaction({
        type: 'OUT', date, itemCode, quantity, unit: item.unit, lotNo,
        expiryDate: lot ? lot.expiryDate : null,
        purpose: fd.get('purpose'), issuedTo: fd.get('issuedTo'),
        referenceNo: fd.get('referenceNo'), note: fd.get('note'), user: issuedBy
      }, issuedBy);
      toast('Đã lưu phiếu Xuất kho cho ' + itemCode + '.', 'success');
      if (closeFn) closeFn();
      if (onSuccess) onSuccess();
    } catch (err) {
      toast('Lỗi: ' + err.message, 'error');
    } finally {
      submitBtn.disabled = false;
    }
  });
}

async function wireAdjustmentForm(root, itemCodeFixed, onSuccess, closeFn) {
  const form = root.querySelector('#adjustment-form');
  const balanceBanner = root.querySelector('#adj-balance');
  wirePicField(form, 'user');

  async function syncBalance(code) {
    code = itemCodeFixed || code;
    if (!code) { balanceBanner.style.display = 'none'; return; }
    const bal = await getBalance(code);
    balanceBanner.style.display = '';
    balanceBanner.textContent = 'Tồn kho hệ thống hiện tại: ' + fmtNum(bal);
  }
  wireItemCombobox(form, 'itemCode', syncBalance);
  syncBalance(form.querySelector('[name="itemCode"]').value);

  form.querySelector('[data-cancel]').addEventListener('click', () => closeFn && closeFn());

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearFieldErrors(form);
    const fd = new FormData(form);
    const itemCode = itemCodeFixed || fd.get('itemCode');
    const quantity = parseFloat(fd.get('quantity'));
    const note = (fd.get('note') || '').trim();
    let hasError = false;
    if (!itemCode) { fieldError(form, 'itemCode', 'Vui lòng chọn mặt hàng.'); hasError = true; }
    if (!(quantity > 0)) { fieldError(form, 'quantity', 'Số lượng phải lớn hơn 0.'); hasError = true; }
    if (!note) { fieldError(form, 'note', 'Mỗi điều chỉnh đều bắt buộc phải có lý do.'); hasError = true; }
    if (hasError) return;

    const item = await getItemByCode(itemCode);
    const signed = fd.get('direction') === 'decrease' ? -quantity : quantity;
    const settings = await getSettings();
    const adjUser = picFieldValue(form, 'user');
    if (!settings.allowNegativeStock) {
      const bal = await getBalance(itemCode);
      if (bal + signed < -1e-9) {
        fieldError(form, 'quantity', 'Điều chỉnh này sẽ khiến tồn kho bị âm.');
        return;
      }
    }

    const submitBtn = form.querySelector('[type="submit"]');
    submitBtn.disabled = true;
    try {
      await postTransaction({
        type: 'ADJUSTMENT', date: fd.get('date'), itemCode, quantity: signed, unit: item.unit,
        lotNo: fd.get('lotNo') || null, note, user: adjUser
      }, adjUser);
      toast('Đã lưu điều chỉnh cho ' + itemCode + '.', 'success');
      if (closeFn) closeFn();
      if (onSuccess) onSuccess();
    } catch (err) {
      toast('Lỗi: ' + err.message, 'error');
    } finally {
      submitBtn.disabled = false;
    }
  });
}

async function openAdjustmentModal(itemCode, onSuccess, prefillLotNo) {
  const overlay = openModal(modalHeader('🛠 Điều chỉnh tồn kho') + await adjustmentFormHtml(itemCode, prefillLotNo), { persistent: true });
  wireModalClose(overlay);
  wireAdjustmentForm(overlay, itemCode, onSuccess, () => closeModal(overlay));

  async function syncItem(code) {
    code = itemCodeFixed || code;
    lotSelect.innerHTML = '<option value="">— chọn lô —</option>';
    balanceBanner.style.display = 'none';
    if (!code) return;
    lots = (await getLotsForItem(code)).filter(l => l.quantity > 0 && l.status !== 'DISPOSED');
    const bal = await getBalance(code);
    balanceBanner.style.display = '';
    balanceBanner.textContent = 'Tồn hiện tại: ' + fmtNum(bal);
    lots.forEach(l => {
      const opt = document.createElement('option');
      opt.value = l.lotNo;
      const exp = effectiveExpiry(l);
      opt.textContent = l.lotNo + ' — SL ' + fmtNum(l.quantity) + (exp ? ' — HSD ' + fmtDate(exp) : '') + (exp && daysBetween(todayISO(), exp) < 0 ? ' (ĐÃ HẾT HẠN)' : '');
      lotSelect.appendChild(opt);
    });
  }
  wireItemCombobox(form, 'itemCode', syncItem);
  syncItem(form.querySelector('[name="itemCode"]').value);

  form.querySelector('[data-cancel]').addEventListener('click', () => closeFn && closeFn());

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearFieldErrors(form);
    const fd = new FormData(form);
    const itemCode = itemCodeFixed || fd.get('itemCode');
    const lotNo = fd.get('lotNo');
    const quantity = parseFloat(fd.get('quantity'));
    const reason = fd.get('reason');

    let hasError = false;
    if (!itemCode) { fieldError(form, 'itemCode', 'Vui lòng chọn mặt hàng.'); hasError = true; }
    if (!lotNo) { fieldError(form, 'lotNo', 'Bắt buộc chọn lô khi hủy bỏ.'); hasError = true; }
    if (!(quantity > 0)) { fieldError(form, 'quantity', 'Số lượng phải lớn hơn 0.'); hasError = true; }
    if (!reason) { fieldError(form, 'reason', 'Vui lòng chọn lý do.'); hasError = true; }
    if (hasError) return;

    const lot = lots.find(l => l.lotNo === lotNo);
    if (lot && quantity > lot.quantity + 1e-9) {
      fieldError(form, 'quantity', 'Không thể hủy vượt quá tồn của lô (' + fmtNum(lot.quantity) + ').');
      return;
    }
    const ok = await confirmModal('Xác nhận hủy bỏ ' + quantity + ' ' + (await getItemByCode(itemCode)).unit + ' từ lô ' + lotNo + '?\nLý do: ' + reason, { danger: true, okLabel: 'Xác nhận hủy bỏ' });
    if (!ok) return;

    const item = await getItemByCode(itemCode);
    const submitBtn = form.querySelector('[type="submit"]');
    submitBtn.disabled = true;
    try {
      await postTransaction({
        type: 'DISPOSAL', date: fd.get('date'), itemCode, quantity, unit: item.unit, lotNo,
        note: fd.get('note'), referenceNo: reason, user: fd.get('user')
      }, fd.get('user'));
      toast('Đã ghi nhận hủy bỏ cho ' + itemCode + '.', 'success');
      if (closeFn) closeFn();
      if (onSuccess) onSuccess();
    } catch (err) {
      toast('Lỗi: ' + err.message, 'error');
    } finally {
      submitBtn.disabled = false;
    }
  });
}

async function openDisposalModal(itemCode, onSuccess) {
  const overlay = openModal(modalHeader('🗑 Hủy bỏ hàng') + await disposalFormHtml(itemCode), { persistent: true });
  wireModalClose(overlay);
  wireDisposalForm(overlay, itemCode, onSuccess, () => closeModal(overlay));
}

// stock-take.js — Stock Take workflow: create → count → review → confirm (creates ADJUSTMENT tx).
'use strict';

async function renderStockTakeRoute(container, query, rest) {
  const sub = rest && rest[0];
  if (sub === 'new') return renderStockTakeNew(container);
  if (sub) return renderStockTakeDetail(container, sub);
  return renderStockTakeList(container);
}

async function renderStockTakeList(container) {
  setPageTitle('Kiểm kê');
  const takes = (await getAllStockTakes()).sort((a, b) => (a.date < b.date ? 1 : -1));
  container.innerHTML =
    '<div class="quick-actions"><a class="btn btn-primary" href="#/stock-take/new">➕ Tạo phiếu kiểm kê</a></div>' +
    '<div class="table-wrap"><table class="data-table">' +
    '<thead><tr><th>Số phiếu</th><th>Ngày</th><th>Người kiểm</th><th>Trạng thái</th><th>Ghi chú</th><th></th></tr></thead>' +
    '<tbody>' + (takes.length ? takes.map(t =>
      '<tr class="row-link" data-id="' + t.id + '"><td>' + escapeHtml(t.stockTakeNo) + '</td><td>' + fmtDate(t.date) + '</td>' +
      '<td>' + escapeHtml(t.user || '') + '</td><td>' + statusPill(t.status) + '</td><td>' + escapeHtml(t.note || '') + '</td>' +
      '<td><a class="btn btn-secondary btn-sm" href="#/stock-take/' + t.id + '">Mở →</a></td></tr>'
    ).join('') : emptyRow(6, 'Chưa có phiếu kiểm kê nào. Tạo một phiếu để bắt đầu kiểm đếm thực tế.')) +
    '</tbody></table></div>';
}

function statusPill(status) {
  const map = { DRAFT: 'badge-neutral', IN_PROGRESS: 'badge-reorder', COMPLETED: 'badge-normal' };
  const label = { DRAFT: 'Nháp', IN_PROGRESS: 'Đang thực hiện', COMPLETED: 'Hoàn tất' }[status] || status;
  return '<span class="badge ' + (map[status] || 'badge-neutral') + '">' + label + '</span>';
}

async function renderStockTakeNew(container) {
  setPageTitle('Tạo phiếu kiểm kê');
  const items = await getAllItems();
  const locations = Array.from(new Set(items.map(i => i.location).filter(Boolean))).sort();
  const settings = await getSettings();
  container.innerHTML = `
    <div class="card" style="max-width:640px">
      <div class="info-banner">📋 Kiểm kê sẽ chốt lại số tồn hệ thống hiện tại của các mặt hàng được chọn, sau đó cho phép bạn nhập số đếm thực tế. Khi xác nhận, hệ thống chỉ tạo giao dịch Điều chỉnh cho những dòng có chênh lệch — không có gì bị ghi đè âm thầm.</div>
      <form id="st-new-form">
        <div class="form-grid">
          <div class="form-field"><label>Ngày <span class="req">*</span></label><input type="date" name="date" value="${todayISO()}" required></div>
          <div class="form-field"><label>Người kiểm</label><input type="text" name="user" value="${escapeHtml(settings.defaultUser || '')}"></div>
          <div class="form-field"><label>Lọc theo nhóm hàng</label>
            <select name="category"><option value="">Tất cả nhóm hàng</option>${['CHEMICAL', 'MICROBIOLOGY_MEDIA', 'CONSUMABLE', 'LAB_SUPPLY', 'OTHER'].map(c => '<option value="' + c + '">' + categoryLabel(c) + '</option>').join('')}</select>
          </div>
          <div class="form-field"><label>Lọc theo khu vực</label>
            <select name="area"><option value="">Tất cả khu vực</option>${AREA_OPTIONS.map(a => '<option value="' + a + '">' + areaLabel(a) + '</option>').join('')}</select>
          </div>
          <div class="form-field"><label>Lọc theo vị trí</label>
            <select name="location"><option value="">Tất cả vị trí</option>${locations.map(l => '<option value="' + escapeHtml(l) + '">' + escapeHtml(l) + '</option>').join('')}</select>
          </div>
          <div class="form-field full"><label>Ghi chú</label><textarea name="note" placeholder="VD: Kiểm kê tủ hàng tháng — Lab Micro"></textarea></div>
        </div>
        <div class="form-actions">
          <a class="btn btn-secondary" href="#/stock-take">Hủy</a>
          <button type="submit" class="btn btn-primary">Tạo danh sách hàng →</button>
        </div>
      </form>
    </div>
  `;
  container.querySelector('#st-new-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const category = fd.get('category'), areaFilter = fd.get('area'), locationFilter = fd.get('location');
    let list = items.filter(i => i.active !== false);
    if (category) list = list.filter(i => i.category === category);
    if (areaFilter) list = list.filter(i => i.area === areaFilter);
    if (locationFilter) list = list.filter(i => i.location === locationFilter);
    if (!list.length) { toast('Không có mặt hàng nào khớp với bộ lọc đã chọn.', 'error'); return; }

    const stId = uid();
    const stNo = await nextSeq('stockTakeSeq', 'ST', 5);
    const stockTake = { id: stId, stockTakeNo: stNo, date: fd.get('date'), user: fd.get('user'), status: 'IN_PROGRESS', note: fd.get('note'), createdAt: nowISO(), completedAt: null };
    await dbPut(STORES.stockTakes, stockTake);
    for (const item of list) {
      const sysQty = await getBalance(item.itemCode);
      await dbPut(STORES.stockTakeLines, { id: uid(), stockTakeId: stId, itemCode: item.itemCode, systemQuantity: sysQty, physicalQuantity: null, difference: 0, note: '', adjustmentCreated: false });
    }
    await logAudit('STOCK_TAKE', 'stockTakes', stId, fd.get('user'), 'Tạo phiếu kiểm kê ' + stNo + ' (' + list.length + ' mặt hàng)');
    location.hash = '#/stock-take/' + stId;
  });
}

async function renderStockTakeDetail(container, stockTakeId) {
  const st = await dbGet(STORES.stockTakes, stockTakeId);
  if (!st) { container.innerHTML = '<div class="card"><p>Không tìm thấy phiếu kiểm kê.</p></div>'; return; }
  setPageTitle('Kiểm kê ' + st.stockTakeNo);
  const lines = await getStockTakeLines(stockTakeId);
  const items = await getAllItems();
  const itemMap = new Map(items.map(i => [i.itemCode, i]));
  lines.sort((a, b) => a.itemCode.localeCompare(b.itemCode));

  const readOnly = st.status === 'COMPLETED';

  container.innerHTML = `
    <div class="quick-actions">
      <a class="btn btn-secondary btn-sm" href="#/stock-take">← Quay lại</a>
      <span class="badge badge-neutral">${escapeHtml(st.stockTakeNo)}</span>
      ${statusPill(st.status)}
      <span class="field-hint">Ngày: ${fmtDate(st.date)} · Người kiểm: ${escapeHtml(st.user || '—')}</span>
    </div>
    ${st.note ? '<p class="field-hint">' + escapeHtml(st.note) + '</p>' : ''}
    <div class="table-wrap"><table class="data-table">
      <thead><tr><th>Mã</th><th>Tên hàng</th><th class="num">SL hệ thống</th><th class="num">SL thực tế</th><th class="num">Chênh lệch</th><th>Ghi chú</th></tr></thead>
      <tbody id="st-lines-body"></tbody>
    </table></div>
    ${!readOnly ? '<div class="form-actions"><button class="btn btn-secondary" id="st-save-draft">💾 Lưu tạm</button><button class="btn btn-primary" id="st-complete">✓ Xem lại &amp; Xác nhận</button></div>' : '<div class="info-banner">Phiếu kiểm kê này đã hoàn tất. Các chênh lệch đã được chuyển thành giao dịch Điều chỉnh.</div>'}
  `;

  const body = container.querySelector('#st-lines-body');
  body.innerHTML = lines.map(l => {
    const item = itemMap.get(l.itemCode);
    return '<tr data-line="' + l.id + '"><td>' + escapeHtml(l.itemCode) + '</td><td>' + escapeHtml(item ? item.itemName : '') + '</td>' +
      '<td class="num">' + fmtNum(l.systemQuantity) + '</td>' +
      '<td class="num"><input type="number" step="any" style="min-height:34px;padding:6px;text-align:right" class="phys-input" ' + (readOnly ? 'disabled' : '') + ' value="' + (l.physicalQuantity !== null && l.physicalQuantity !== undefined ? l.physicalQuantity : '') + '"></td>' +
      '<td class="num diff-cell">' + (l.physicalQuantity !== null ? fmtNum(l.difference) : '—') + '</td>' +
      '<td><input type="text" class="note-input" ' + (readOnly ? 'disabled' : '') + ' value="' + escapeHtml(l.note || '') + '" style="min-height:34px;padding:6px"></td></tr>';
  }).join('');

  if (readOnly) return;

  function recomputeDiffCell(tr, sysQty) {
    const input = tr.querySelector('.phys-input');
    const cell = tr.querySelector('.diff-cell');
    const v = input.value === '' ? null : parseFloat(input.value);
    if (v === null || isNaN(v)) { cell.textContent = '—'; cell.style.color = ''; return; }
    const diff = v - sysQty;
    cell.textContent = (diff > 0 ? '+' : '') + fmtNum(diff);
    cell.style.color = diff === 0 ? '' : (diff < 0 ? 'var(--status-out)' : 'var(--status-reorder)');
  }
  body.querySelectorAll('tr[data-line]').forEach(tr => {
    const line = lines.find(l => l.id === tr.dataset.line);
    tr.querySelector('.phys-input').addEventListener('input', () => recomputeDiffCell(tr, line.systemQuantity));
    recomputeDiffCell(tr, line.systemQuantity);
  });

  async function collectLines() {
    const updated = [];
    body.querySelectorAll('tr[data-line]').forEach(tr => {
      const line = lines.find(l => l.id === tr.dataset.line);
      const v = tr.querySelector('.phys-input').value;
      const physicalQuantity = v === '' ? null : parseFloat(v);
      const note = tr.querySelector('.note-input').value;
      updated.push({ ...line, physicalQuantity, difference: physicalQuantity !== null ? physicalQuantity - line.systemQuantity : 0, note });
    });
    return updated;
  }

  container.querySelector('#st-save-draft').addEventListener('click', async () => {
    const updated = await collectLines();
    for (const l of updated) await dbPut(STORES.stockTakeLines, l);
    toast('Đã lưu tạm.', 'success');
  });

  container.querySelector('#st-complete').addEventListener('click', async () => {
    const updated = await collectLines();
    const uncounted = updated.filter(l => l.physicalQuantity === null);
    if (uncounted.length) {
      const proceed = await confirmModal(uncounted.length + ' mặt hàng chưa nhập số đếm thực tế và sẽ được bỏ qua (coi như không thay đổi). Tiếp tục?', { okLabel: 'Tiếp tục' });
      if (!proceed) return;
    }
    const withDiff = updated.filter(l => l.physicalQuantity !== null && l.difference !== 0);
    const summary = withDiff.length
      ? withDiff.map(l => l.itemCode + ': ' + (l.difference > 0 ? '+' : '') + fmtNum(l.difference)).join('\n')
      : 'Không có chênh lệch — sẽ không tạo điều chỉnh nào.';
    const ok = await confirmModal('Xác nhận hoàn tất kiểm kê?\n\n' + summary, { okLabel: 'Xác nhận & Tạo điều chỉnh' });
    if (!ok) return;

    for (const l of updated) {
      await dbPut(STORES.stockTakeLines, l);
      if (l.physicalQuantity !== null && l.difference !== 0 && !l.adjustmentCreated) {
        const item = itemMap.get(l.itemCode);
        await postTransaction({
          type: 'ADJUSTMENT', date: st.date, itemCode: l.itemCode, quantity: l.difference, unit: item ? item.unit : '',
          note: 'Điều chỉnh theo kiểm kê thực tế (Phiếu ' + st.stockTakeNo + ')', referenceNo: st.stockTakeNo
        }, st.user);
        l.adjustmentCreated = true;
        await dbPut(STORES.stockTakeLines, l);
      }
    }
    st.status = 'COMPLETED';
    st.completedAt = nowISO();
    await dbPut(STORES.stockTakes, st);
    await logAudit('STOCK_TAKE', 'stockTakes', st.id, st.user, 'Hoàn tất kiểm kê ' + st.stockTakeNo + ' — đã tạo ' + withDiff.length + ' điều chỉnh');
    toast('Đã hoàn tất kiểm kê.', 'success');
    renderStockTakeDetail(container, stockTakeId);
  });
}

function renderMdRows(container) {
  const search = container.querySelector('#md-search').value.trim().toLowerCase();
  const category = container.querySelector('#md-category').value;
  const area = container.querySelector('#md-area').value;
  const showInactive = container.querySelector('#md-inactive').checked;

  let rows = _mdCache.filter(i => showInactive ? true : i.active !== false);
  if (search) rows = rows.filter(i => i.itemCode.toLowerCase().includes(search) || i.itemName.toLowerCase().includes(search));
  if (category) rows = rows.filter(i => i.category === category);
  if (area) rows = rows.filter(i => i.area === area);
  rows.sort((a, b) => a.itemCode.localeCompare(b.itemCode));

  const body = container.querySelector('#md-body');
  body.innerHTML = rows.length ? rows.map(i => `
    <tr>
      <td>${escapeHtml(i.itemCode)}</td><td>${escapeHtml(i.itemName)}</td><td>${categoryLabel(i.category)}</td>
      <td>${i.area ? areaLabel(i.area) : '—'}</td>
      <td>${escapeHtml(i.unit)}</td><td>${escapeHtml(i.location || '')}</td>
      <td class="num">${fmtNum(i.minimumStock)}</td><td class="num">${fmtNum(i.reorderPoint)}</td><td class="num">${i.maximumStock !== undefined && i.maximumStock !== null ? fmtNum(i.maximumStock) : '—'}</td>
      <td>${i.active === false ? '<span class="badge badge-neutral">Ngừng dùng</span>' : '<span class="badge badge-normal">Đang dùng</span>'}</td>
      <td style="white-space:nowrap">
        <button class="btn btn-ghost btn-sm" data-edit="${escapeHtml(i.id)}">Sửa</button>
        <button class="btn btn-ghost btn-sm" data-toggle="${escapeHtml(i.id)}">${i.active === false ? 'Kích hoạt lại' : 'Ngừng dùng'}</button>
      </td>
    </tr>
  `).join('') : emptyRow(11, 'Không tìm thấy mặt hàng nào.');
  container.querySelector('#md-count').textContent = rows.length + ' mặt hàng';

  body.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', () => {
    const item = _mdCache.find(i => i.id === btn.dataset.edit);
    openItemFormModal(item, () => renderMasterData(container));
  }));
  body.querySelectorAll('[data-toggle]').forEach(btn => btn.addEventListener('click', async () => {
    const item = _mdCache.find(i => i.id === btn.dataset.toggle);
    const nextActive = item.active === false;
    const ok = await confirmModal((nextActive ? 'Kích hoạt lại' : 'Ngừng dùng') + ' mặt hàng ' + item.itemCode + '?');
    if (!ok) return;
    await setItemActive(item.id, nextActive, (await getSettings()).defaultUser);
    toast('Đã ' + (nextActive ? 'kích hoạt lại' : 'ngừng dùng') + ' mặt hàng.', 'success');
    renderMasterData(container);
  }));
}

  });
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearFieldErrors(form);
    const fd = new FormData(form);
    const itemCode = fd.get('itemCode').trim();
    const itemName = fd.get('itemName').trim();
    const unit = fd.get('unit').trim();
    let hasError = false;
    if (!itemCode) { fieldError(form, 'itemCode', 'Vui lòng nhập mã hàng.'); hasError = true; }
    if (!itemName) { fieldError(form, 'itemName', 'Vui lòng nhập tên hàng.'); hasError = true; }
    if (!unit) { fieldError(form, 'unit', 'Vui lòng nhập đơn vị tính.'); hasError = true; }
    if (hasError) return;

    const supplierCodes = Array.from(scContainer.querySelectorAll('[data-sc-row]')).map(row => ({
      supplier: row.querySelector('[data-sc-supplier]').value.trim(),
      code: row.querySelector('[data-sc-code]').value.trim(),

    })).filter(r => r.supplier || r.code);

    const payload = {
      id: item ? item.id : undefined,
      itemCode, itemName, category: fd.get('category'), subCategory: fd.get('subCategory'),
      area: fd.get('area') || null,
      unit, location: fd.get('location'),
      minimumStock: parseFloat(fd.get('minimumStock')) || 0,
      reorderPoint: parseFloat(fd.get('reorderPoint')) || 0,
      maximumStock: fd.get('maximumStock') ? parseFloat(fd.get('maximumStock')) : null,
      defaultSupplier: fd.get('defaultSupplier'), storageCondition: fd.get('storageCondition'),

      PIC: fd.get('PIC'), note: fd.get('note'),
      active: item ? fd.get('active') === 'on' : true,
      supplierCodes
    };

      toast('Đã lưu mặt hàng.', 'success');
      closeModal(overlay);

  });

// Reads a .xlsx (primary) or .csv (still accepted) file into the same row-object shape.
async function fileToImportObjects(file) {
  if (/\.xlsx$/i.test(file.name)) {
    const buf = await file.arrayBuffer();

  }

function openImportPreviewModal(objects, onSuccess) {
  const { valid, errors } = validateImportRows(objects);
  const overlay = openModal(modalHeader('Nhập danh mục hàng hóa — Xem trước') +
    '<p>' + valid.length + ' dòng hợp lệ, ' + errors.length + ' dòng lỗi trên tổng ' + objects.length + ' dòng.</p>' +
    '<div class="table-wrap" style="max-height:320px"><table class="data-table"><thead><tr><th>#</th><th>Mã hàng</th><th>Tên hàng</th><th>Vấn đề</th></tr></thead><tbody>' +
    objects.map((o, idx) => {
      const err = errors.find(e => e.row === idx);
      return '<tr>' + '<td>' + (idx + 2) + '</td><td>' + escapeHtml(o.itemCode || '') + '</td><td>' + escapeHtml(o.itemName || '') + '</td>' +
        '<td>' + (err ? '<span class="badge badge-out">' + escapeHtml(err.message) + '</span>' : '<span class="badge badge-normal">Hợp lệ</span>') + '</td></tr>';
    }).join('') + '</tbody></table></div>' +
    '<div class="form-actions">' +
    (errors.length ? '<button type="button" class="btn btn-secondary" data-download-errors>⭳ Tải báo cáo lỗi</button>' : '') +
    '<button type="button" class="btn btn-secondary" data-close-modal>Hủy</button>' +
    '<button type="button" class="btn btn-primary" data-confirm-import ' + (valid.length ? '' : 'disabled') + '>Xác nhận nhập (' + valid.length + ')</button>' +
    '</div>', { wide: true, persistent: true }
  );
  wireModalClose(overlay);
  if (errors.length) overlay.querySelector('[data-download-errors]').addEventListener('click', () => {
    const csv = rowsToCsv(['row', 'itemCode', 'itemName', 'error'], errors.map(e => [e.row + 2, objects[e.row].itemCode || '', objects[e.row].itemName || '', e.message]));
    downloadFile('IMPORT_ERRORS.csv', csv, 'text/csv;charset=utf-8');
  });
  const btn = overlay.querySelector('[data-confirm-import]');
  btn.addEventListener('click', async () => {
    let created = 0, updated = 0, failed = 0;
    for (const row of valid) {
      try {
        const existing = await getItemByCode(row.itemCode);
        await saveItem({ ...(existing || {}), ...row, id: existing ? existing.id : undefined }, 'import');
        existing ? updated++ : created++;
      } catch (e) { failed++; }
    }
    await logAudit('IMPORT', 'items', 'bulk', 'import', 'Đã tạo ' + created + ', cập nhật ' + updated + ', lỗi ' + failed);
    toast('Nhập hoàn tất: tạo mới ' + created + ', cập nhật ' + updated + (failed ? ', lỗi ' + failed : '') + '.', 'success');
    closeModal(overlay);
    if (onSuccess) onSuccess();
  });
}

function validateImportRows(objects) {
  const valid = [], errors = [];
  const seenCodes = new Set();
  objects.forEach((o, idx) => {
    const itemCode = (o.itemCode || '').trim();
    const itemName = (o.itemName || '').trim();
    const unit = (o.unit || '').trim();
    if (isExcelError(itemCode) || isExcelError(itemName)) { errors.push({ row: idx, message: 'Giá trị lỗi Excel trong dữ liệu nguồn' }); return; }
    if (!itemCode) { errors.push({ row: idx, message: 'Thiếu mã hàng (itemCode)' }); return; }
    if (!itemName) { errors.push({ row: idx, message: 'Thiếu tên hàng (itemName)' }); return; }
    if (!unit) { errors.push({ row: idx, message: 'Thiếu đơn vị tính (unit)' }); return; }
    if (seenCodes.has(itemCode)) { errors.push({ row: idx, message: 'Mã hàng bị trùng trong file nhập' }); return; }

    for (const field of ['minimumStock', 'reorderPoint', 'maximumStock', 'openedExpiryDays']) {
      const raw = o[field];
      if (raw === undefined || raw === null || raw === '') continue;
      const n = parseFloat(raw);
      if (isNaN(n) || n < 0) { errors.push({ row: idx, message: 'Giá trị "' + field + '" không hợp lệ (' + raw + ') — phải là số ≥ 0' }); return; }
    }
    seenCodes.add(itemCode);
    const category = CATEGORY_OPTIONS.includes(o.category) ? o.category : 'OTHER';
    const area = AREA_OPTIONS.includes(o.area) ? o.area : null;
    valid.push({
      itemCode, itemName, category, subCategory: o.subCategory || '', area, unit,
      location: o.location || '', minimumStock: parseFloat(o.minimumStock) || 0,
      reorderPoint: parseFloat(o.reorderPoint) || 0,
      maximumStock: o.maximumStock ? parseFloat(o.maximumStock) : null,
      defaultSupplier: o.defaultSupplier || '', storageCondition: o.storageCondition || '',
      expiryControl: String(o.expiryControl).toLowerCase() === 'true',
      openedExpiryDays: o.openedExpiryDays ? parseInt(o.openedExpiryDays, 10) : null,
      PIC: o.PIC || '', note: o.note || '', active: String(o.active).toLowerCase() !== 'false'
    });
  });
  return { valid, errors };
}

// transactions.js — Transaction History with filters + CSV export.
'use strict';

let _txCache = [];
let _txItemMap = new Map();
let _txPage = 1;
const TX_PAGE_SIZE = 50;

async function renderTransactions(container, params) {
  setPageTitle('Lịch sử giao dịch');
  const [txs, items] = await Promise.all([getAllTransactions(), getAllItems()]);
  _txCache = txs.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (a.createdAt < b.createdAt ? 1 : -1)));
  _txItemMap = new Map(items.map(i => [i.itemCode, i]));
  _txPage = 1;

  const qs = new URLSearchParams(params || '');

  container.innerHTML = `
    <div class="toolbar">
      <input type="date" id="tx-from" title="Từ ngày">
      <input type="date" id="tx-to" title="Đến ngày">
      <select id="tx-type"><option value="">Tất cả loại giao dịch</option>${Object.keys(TX_TYPE_LABEL).map(t => '<option value="' + t + '">' + TX_TYPE_LABEL[t] + '</option>').join('')}</select>
      <select id="tx-category"><option value="">Tất cả nhóm hàng</option>${CATEGORY_OPTIONS.map(c => '<option value="' + c + '">' + categoryLabel(c) + '</option>').join('')}</select>
      <select id="tx-area"><option value="">Tất cả khu vực</option>${AREA_OPTIONS.map(a => '<option value="' + a + '">' + areaLabel(a) + '</option>').join('')}</select>
      <div class="grow search-box"><input type="search" id="tx-search" placeholder="🔍 Mã/tên hàng, số lô, người thực hiện…"></div>
      <button class="btn btn-secondary btn-sm" id="tx-export-excel">⭳ Xuất Excel</button>
      <button class="btn btn-secondary btn-sm" id="tx-export">⭳ Xuất CSV</button>
    </div>
    <div class="table-wrap"><table class="data-table">
      <thead><tr><th>Số CT</th><th>Ngày</th><th>Loại</th><th>Mặt hàng</th><th class="num">SL</th><th>ĐVT</th><th>Số lô</th><th>Hạn dùng</th><th>Người thực hiện</th><th>Mục đích/Ghi chú</th></tr></thead>
      <tbody id="tx-body"></tbody>
    </table></div>
    <div class="pager" id="tx-pager"></div>
  `;

  if (qs.get('item')) container.querySelector('#tx-search').value = qs.get('item');

  ['tx-from', 'tx-to', 'tx-type', 'tx-category', 'tx-area', 'tx-search'].forEach(id => {
    const node = container.querySelector('#' + id);
    node.addEventListener(node.tagName === 'SELECT' ? 'change' : 'input', () => { _txPage = 1; renderTxRows(container); });
  });
  container.querySelector('#tx-export').addEventListener('click', () => exportTxCsv(filterTx(container)));
  container.querySelector('#tx-export-excel').addEventListener('click', () => exportTxExcel(filterTx(container)));

  renderTxRows(container);
}

function filterTx(container) {
  const from = container.querySelector('#tx-from').value;
  const to = container.querySelector('#tx-to').value;
  const type = container.querySelector('#tx-type').value;
  const category = container.querySelector('#tx-category').value;
  const area = container.querySelector('#tx-area').value;
  const search = container.querySelector('#tx-search').value.trim().toLowerCase();

  return _txCache.filter(t => {
    if (from && t.date < from) return false;
    if (to && t.date > to) return false;
    if (type && t.type !== type) return false;
    if (category) { const item = _txItemMap.get(t.itemCode); if (!item || item.category !== category) return false; }
    if (area) { const item = _txItemMap.get(t.itemCode); if (!item || item.area !== area) return false; }
    if (search) {
      const item = _txItemMap.get(t.itemCode);
      const hay = [t.itemCode, item ? item.itemName : '', t.lotNo, t.user, t.purpose, t.note].join(' ').toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });
}

function renderTxRows(container) {
  const rows = filterTx(container);
  const totalPages = Math.max(1, Math.ceil(rows.length / TX_PAGE_SIZE));
  if (_txPage > totalPages) _txPage = totalPages;
  const pageRows = rows.slice((_txPage - 1) * TX_PAGE_SIZE, _txPage * TX_PAGE_SIZE);

  const body = container.querySelector('#tx-body');
  body.innerHTML = pageRows.length ? pageRows.map(t => {
    const item = _txItemMap.get(t.itemCode);
    return '<tr class="row-link" data-code="' + escapeHtml(t.itemCode) + '">' +
      '<td>' + escapeHtml(t.transactionNo) + '</td><td>' + fmtDate(t.date) + '</td>' +
      '<td>' + (TX_TYPE_LABEL[t.type] || t.type) + '</td>' +
      '<td>' + escapeHtml(t.itemCode) + ' — ' + escapeHtml(item ? item.itemName : '') + '</td>' +
      '<td class="num">' + (t.type === 'ADJUSTMENT' && t.quantity > 0 ? '+' : '') + fmtNum(t.quantity) + '</td>' +
      '<td>' + escapeHtml(t.unit || '') + '</td><td>' + escapeHtml(t.lotNo || '—') + '</td>' +
      '<td>' + (t.expiryDate ? fmtDate(t.expiryDate) : '—') + '</td>' +
      '<td>' + escapeHtml(t.user || '') + '</td><td>' + escapeHtml(t.purpose || t.note || '') + '</td></tr>';
  }).join('') : emptyRow(10, 'Không có giao dịch nào khớp với bộ lọc hiện tại.');

  body.querySelectorAll('tr[data-code]').forEach(tr => tr.addEventListener('click', () => { location.hash = '#/item/' + encodeURIComponent(tr.dataset.code); }));

  const pager = container.querySelector('#tx-pager');
  pager.innerHTML = rows.length + ' giao dịch · Trang ' + _txPage + ' / ' + totalPages +
    ' <button class="btn btn-ghost btn-sm" id="tx-prev" ' + (_txPage <= 1 ? 'disabled' : '') + '>‹ Trước</button>' +
    '<button class="btn btn-ghost btn-sm" id="tx-next" ' + (_txPage >= totalPages ? 'disabled' : '') + '>Sau ›</button>';
  const prev = pager.querySelector('#tx-prev'); if (prev) prev.addEventListener('click', () => { _txPage--; renderTxRows(container); });
  const next = pager.querySelector('#tx-next'); if (next) next.addEventListener('click', () => { _txPage++; renderTxRows(container); });
}

function exportTxCsv(rows) {
  const headers = ['transactionNo', 'date', 'type', 'itemCode', 'itemName', 'quantity', 'unit', 'lotNo', 'expiryDate', 'user', 'purpose', 'issuedTo', 'supplier', 'referenceNo', 'note'];
  const data = rows.map(t => {
    const item = _txItemMap.get(t.itemCode);
    return [t.transactionNo, t.date, t.type, t.itemCode, item ? item.itemName : '', t.quantity, t.unit, t.lotNo || '', t.expiryDate || '', t.user || '', t.purpose || '', t.issuedTo || '', t.supplier || '', t.referenceNo || '', t.note || ''];
  });
  downloadFile('QA_Stock_Transactions_' + todayISO() + '.csv', rowsToCsv(headers, data), 'text/csv;charset=utf-8');
}

function exportTxExcel(rows) {
  const headers = ['Số CT', 'Ngày', 'Loại', 'Mã hàng', 'Tên hàng', 'Số lượng', 'ĐVT', 'Số lô', 'Hạn dùng', 'Người thực hiện', 'Mục đích', 'Cấp cho', 'Nhà cung cấp', 'Tham chiếu', 'Ghi chú'];
  const data = rows.map(t => {
    const item = _txItemMap.get(t.itemCode);
    return [t.transactionNo, fmtDate(t.date), TX_TYPE_LABEL[t.type] || t.type, t.itemCode, item ? item.itemName : '', t.quantity, t.unit, t.lotNo || '', t.expiryDate ? fmtDate(t.expiryDate) : '', t.user || '', t.purpose || '', t.issuedTo || '', t.supplier || '', t.referenceNo || '', t.note || ''];
  });
  XLSX.download('QA_Stock_GiaoDich_' + todayISO() + '.xlsx', 'Giao dich', headers, data);
}

async function updateAlarmBadge() {
  const badge = document.getElementById('nav-alarm-badge');
  if (!badge) return;
  try {
    const rows = (await getInventorySnapshot()).filter(r => r.item.active !== false);
    const count = buildActionRequiredList(rows).length;
    if (count > 0) { badge.textContent = count > 99 ? '99+' : String(count); badge.style.display = ''; }
    else badge.style.display = 'none';
  } catch (e) { /* non-fatal — badge just stays at its last known value */ }
}

async function renderAlerts(container, params) {
  setPageTitle('Cảnh báo');
  const rows = (await getInventorySnapshot()).filter(r => r.item.active !== false);
  const alerts = buildActionRequiredList(rows);
  const qs = new URLSearchParams(params || '');

  container.innerHTML = `
    <div class="toolbar">
      <select id="al-severity">
        <option value="">Tất cả loại cảnh báo</option>
        <option value="out">🔴 Hết hàng</option>
        <option value="reorder">🟠 Cần đặt hàng / Tồn thấp</option>
        <option value="approaching">🟡 Sắp cần đặt hàng</option>
        <option value="expiring">⚠️ Sắp hết hạn</option>
        <option value="expired">❌ Đã hết hạn</option>
      </select>
      <span class="field-hint">${alerts.length} cảnh báo trên ${new Set(alerts.map(a => a.code)).size} mặt hàng</span>
    </div>
    <div class="card"><div id="al-list"></div></div>
  `;
  if (qs.get('severity')) container.querySelector('#al-severity').value = qs.get('severity');

  function draw() {
    const sev = container.querySelector('#al-severity').value;
    const filtered = sev ? alerts.filter(a => a.sev === sev) : alerts;
    const list = container.querySelector('#al-list');
    list.innerHTML = filtered.length ? filtered.map(a =>
      '<div class="alert-item sev-' + a.sev + '" data-code="' + escapeHtml(a.code) + '">' +
      '<span class="alert-icon">' + a.icon + '</span>' +
      '<div class="alert-body"><div class="alert-title">' + a.title + '</div><div class="alert-sub">' + escapeHtml(a.sub) + '</div></div>' +

  }
  container.querySelector('#al-severity').addEventListener('change', draw);
  draw();
}

// reports.js — 11 report types: on-screen table + CSV export + browser print.
'use strict';

const REPORT_DEFS = [
  { id: 'current-inventory', icon: '📦', title: 'Tồn kho hiện tại' },
  { id: 'low-stock', icon: '🟠', title: 'Tồn thấp' },
  { id: 'expired', icon: '❌', title: 'Hàng đã hết hạn' },
  { id: 'expiring-soon', icon: '⚠️', title: 'Hàng sắp hết hạn' },
  { id: 'stock-in', icon: '➕', title: 'Nhập kho' },
  { id: 'stock-out', icon: '➖', title: 'Xuất kho' },
  { id: 'consumption-item', icon: '📈', title: 'Tiêu thụ theo mặt hàng (90 ngày)' },
  { id: 'consumption-category', icon: '📊', title: 'Tiêu thụ theo nhóm hàng' },
  { id: 'monthly-movement', icon: '🗓️', title: 'Biến động tồn kho theo kỳ', interactive: true },
  { id: 'stock-take-diff', icon: '📋', title: 'Chênh lệch kiểm kê' },
  { id: 'disposal', icon: '🗑️', title: 'Báo cáo hủy bỏ' },
  { id: 'usage-chart', icon: '📉', title: 'Biểu đồ tiêu thụ theo mặt hàng (theo năm)', interactive: true }
];

async function renderReports(container, params, reportId) {
  setPageTitle('Báo cáo');
  const qs = new URLSearchParams(params || '');
  const activeId = reportId || qs.get('r');
  let currentReportId = null;

  container.innerHTML =
    '<div class="toolbar">' +
      '<select id="rp-category"><option value="">Tất cả nhóm hàng</option>' + CATEGORY_OPTIONS.map(c => '<option value="' + c + '">' + categoryLabel(c) + '</option>').join('') + '</select>' +
      '<select id="rp-area"><option value="">Tất cả khu vực</option>' + AREA_OPTIONS.map(a => '<option value="' + a + '">' + areaLabel(a) + '</option>').join('') + '</select>' +
    '</div>' +
    '<div class="report-grid">' + REPORT_DEFS.map(r =>
      '<div class="report-tile" data-r="' + r.id + '"><span class="rt-icon">' + r.icon + '</span><div class="rt-title">' + r.title + '</div></div>'
    ).join('') + '</div>' +
    '<div id="report-output" style="margin-top:20px"></div>';

  function currentFilters() {
    return { category: container.querySelector('#rp-category').value, area: container.querySelector('#rp-area').value };
  }

  // Changing the category/area filter re-renders the active report from scratch — capture its
  // own controls first (period type; item+year for the usage chart) so that refresh doesn't
  // silently reset them back to their defaults.
  function captureReportUiState() {
    const periodSel = container.querySelector('#mv-period-type');
    if (periodSel) return { periodType: periodSel.value };
    const yearSel = container.querySelector('#uc-year');
    if (yearSel) return { itemCode: itemComboboxValue(container, 'uc-item'), year: yearSel.value };
    return null;
  }

  container.querySelectorAll('.report-tile').forEach(tile => tile.addEventListener('click', () => {
    currentReportId = tile.dataset.r;
    runReport(container, currentReportId, currentFilters());
  }));
  ['rp-category', 'rp-area'].forEach(id => container.querySelector('#' + id).addEventListener('change', () => {
    if (currentReportId) runReport(container, currentReportId, currentFilters(), captureReportUiState());
  }));

  if (activeId) { currentReportId = activeId; runReport(container, activeId, currentFilters()); }
}

async function runReport(container, id, filters, uiState) {
  const out = container.querySelector('#report-output');
  out.innerHTML = '<p>Đang tạo báo cáo…</p>';
  const def = REPORT_DEFS.find(r => r.id === id);

  if (id === 'monthly-movement') { await renderMovementReport(out, def, filters, uiState); return; }
  if (id === 'usage-chart') { await renderUsageChartReport(out, def, uiState); return; }

  const report = await buildReport(id, filters);

  out.innerHTML = `
    <div class="card">
      <div class="quick-actions" style="margin-bottom:10px">
        <h3 style="margin:0;flex:1">${def.icon} ${def.title}</h3>
        <button class="btn btn-secondary btn-sm" id="rp-excel">⭳ Xuất Excel</button>
        <button class="btn btn-secondary btn-sm" id="rp-csv">⭳ Xuất CSV</button>
        <button class="btn btn-secondary btn-sm" id="rp-print">🖶 In</button>
      </div>
      ${report.summary ? '<p class="field-hint">' + report.summary + '</p>' : ''}
      <div class="table-wrap"><table class="data-table" id="rp-table">
        <thead><tr>${report.headers.map(h => '<th>' + escapeHtml(h) + '</th>').join('')}</tr></thead>
        <tbody>${report.rows.length ? report.rows.map(r => '<tr>' + r.map(c => '<td>' + escapeHtml(c) + '</td>').join('') + '</tr>').join('') : emptyRow(report.headers.length, 'Không có dữ liệu cho báo cáo này.')}</tbody>
      </table></div>
    </div>
  `;
  out.querySelector('#rp-csv').addEventListener('click', () => downloadFile('QA_Report_' + id + '_' + todayISO() + '.csv', rowsToCsv(report.headers, report.rows), 'text/csv;charset=utf-8'));
  out.querySelector('#rp-excel').addEventListener('click', () => XLSX.download('QA_Report_' + id + '_' + todayISO() + '.xlsx', def.title, report.headers, report.rows));
  out.querySelector('#rp-print').addEventListener('click', () => window.print());
}

// filters: { category, area } — applied uniformly (an item must match both, when set) across
// every report below, including the transaction-log ones (via allowedCodes).
async function buildReport(id, filters) {
  filters = filters || {};
  const snapshot = await getInventorySnapshot();
  let active = snapshot.filter(r => r.item.active !== false);
  if (filters.category) active = active.filter(r => r.item.category === filters.category);
  if (filters.area) active = active.filter(r => r.item.area === filters.area);
  const allowedCodes = new Set(active.map(r => r.item.itemCode));

  switch (id) {
    case 'current-inventory':
      return {
        headers: ['Mã', 'Tên hàng', 'Nhóm hàng', 'Khu vực', 'ĐVT', 'Tồn', 'Tối thiểu', 'Ngưỡng ĐH', 'Vị trí', 'Trạng thái'],
        rows: active.map(r => [r.item.itemCode, r.item.itemName, categoryLabel(r.item.category), r.item.area ? areaLabel(r.item.area) : '', r.item.unit, fmtNum(r.balance), fmtNum(r.item.minimumStock), fmtNum(r.item.reorderPoint), r.item.location || '', STATUS_META[r.status].label])
      };
    case 'low-stock':
      return {
        headers: ['Mã', 'Tên hàng', 'Tồn', 'Tối thiểu', 'Ngưỡng ĐH', 'Trạng thái'],
        rows: active.filter(r => r.status === 'LOW_STOCK' || r.status === 'OUT_OF_STOCK').map(r => [r.item.itemCode, r.item.itemName, fmtNum(r.balance), fmtNum(r.item.minimumStock), fmtNum(r.item.reorderPoint), STATUS_META[r.status].label])
      };
    case 'expired': {
      const rows = [];
      active.forEach(r => r.lots.forEach(l => { if (l.status === 'ACTIVE' && computeExpiryStatus(l, 30) === 'EXPIRED') rows.push([r.item.itemCode, r.item.itemName, l.lotNo, fmtNum(l.quantity), fmtDate(effectiveExpiry(l))]); }));
      return { headers: ['Mã', 'Tên hàng', 'Số lô', 'SL', 'Hạn dùng'], rows };
    }
    case 'expiring-soon': {
      const settings = await getSettings();
      const rows = [];
      active.forEach(r => r.lots.forEach(l => { if (l.status === 'ACTIVE' && computeExpiryStatus(l, settings.expiryWarningDays) === 'EXPIRING_SOON') rows.push([r.item.itemCode, r.item.itemName, l.lotNo, fmtNum(l.quantity), fmtDate(effectiveExpiry(l))]); }));
      return { headers: ['Mã', 'Tên hàng', 'Số lô', 'SL', 'Hạn dùng'], rows, summary: 'Ngưỡng cảnh báo: ' + settings.expiryWarningDays + ' ngày' };
    }
    case 'stock-in': {
      const txs = (await getAllTransactions()).filter(t => (t.type === 'IN' || t.type === 'OPENING') && allowedCodes.has(t.itemCode));
      const itemMap = new Map((await getAllItems()).map(i => [i.itemCode, i]));
      return { headers: ['Ngày', 'Số CT', 'Mã', 'Tên hàng', 'SL', 'ĐVT', 'Số lô', 'Nhà cung cấp', 'Người thực hiện'], rows: txs.sort((a, b) => a.date < b.date ? 1 : -1).map(t => [fmtDate(t.date), t.transactionNo, t.itemCode, itemMap.get(t.itemCode) ? itemMap.get(t.itemCode).itemName : '', fmtNum(t.quantity), t.unit, t.lotNo || '', t.supplier || '', t.user || '']) };
    }
    case 'stock-out': {
      const txs = (await getAllTransactions()).filter(t => t.type === 'OUT' && allowedCodes.has(t.itemCode));
      const itemMap = new Map((await getAllItems()).map(i => [i.itemCode, i]));
      return { headers: ['Ngày', 'Số CT', 'Mã', 'Tên hàng', 'SL', 'ĐVT', 'Số lô', 'Mục đích', 'Cấp cho', 'Người thực hiện'], rows: txs.sort((a, b) => a.date < b.date ? 1 : -1).map(t => [fmtDate(t.date), t.transactionNo, t.itemCode, itemMap.get(t.itemCode) ? itemMap.get(t.itemCode).itemName : '', fmtNum(t.quantity), t.unit, t.lotNo || '', t.purpose || '', t.issuedTo || '', t.user || '']) };
    }
    case 'consumption-item': {
      const rows = active.map(r => {
        const c = computeConsumption(r.transactions, r.balance, 90);
        return [r.item.itemCode, r.item.itemName, c.avgDaily.toFixed(3), c.avgMonthly.toFixed(2), c.coverageDays !== null ? c.coverageDays : '—', c.estimatedStockoutDate ? fmtDate(c.estimatedStockoutDate) : '—'];
      });
      return { headers: ['Mã', 'Tên hàng', 'TB/ngày', 'TB/tháng', 'Số ngày đủ dùng', 'Dự kiến hết hàng'], rows, summary: 'Tính theo 90 ngày gần nhất của Xuất kho / Hủy bỏ.' };
    }
    case 'consumption-category': {
      const byCat = {};
      active.forEach(r => {
        const c = computeConsumption(r.transactions, r.balance, 90);
        byCat[r.item.category] = byCat[r.item.category] || { totalOut: 0, items: 0 };
        byCat[r.item.category].totalOut += c.totalOut;
        byCat[r.item.category].items += 1;
      });
      return { headers: ['Nhóm hàng', 'Số mặt hàng', 'Tổng tiêu thụ (90 ngày, nhiều ĐVT)'], rows: Object.keys(byCat).map(c => [categoryLabel(c), byCat[c].items, fmtNum(byCat[c].totalOut)]) };
    }
    case 'stock-take-diff': {
      const takes = await getAllStockTakes();
      const itemMap = new Map((await getAllItems()).map(i => [i.itemCode, i]));
      const rows = [];
      for (const st of takes) {
        const lines = await getStockTakeLines(st.id);
        lines.filter(l => l.difference && allowedCodes.has(l.itemCode)).forEach(l => rows.push([st.stockTakeNo, fmtDate(st.date), l.itemCode, itemMap.get(l.itemCode) ? itemMap.get(l.itemCode).itemName : '', fmtNum(l.systemQuantity), l.physicalQuantity !== null ? fmtNum(l.physicalQuantity) : '—', (l.difference > 0 ? '+' : '') + fmtNum(l.difference)]));
      }
      return { headers: ['Số phiếu kiểm kê', 'Ngày', 'Mã', 'Tên hàng', 'SL hệ thống', 'SL thực tế', 'Chênh lệch'], rows };
    }
    case 'disposal': {
      const txs = (await getAllTransactions()).filter(t => t.type === 'DISPOSAL' && allowedCodes.has(t.itemCode));
      const itemMap = new Map((await getAllItems()).map(i => [i.itemCode, i]));
      return { headers: ['Ngày', 'Số CT', 'Mã', 'Tên hàng', 'SL', 'ĐVT', 'Số lô', 'Lý do', 'Người thực hiện'], rows: txs.sort((a, b) => a.date < b.date ? 1 : -1).map(t => [fmtDate(t.date), t.transactionNo, t.itemCode, itemMap.get(t.itemCode) ? itemMap.get(t.itemCode).itemName : '', fmtNum(t.quantity), t.unit, t.lotNo || '', t.referenceNo || '', t.user || '']) };
    }
    default:
      return { headers: [], rows: [] };
  }
}

// ---- Interactive report 1: period-flexible movement (Tháng/Quý/Năm) with totals ----

function periodKeyOf(dateStr, periodType) {
  if (!dateStr) return '';
  if (periodType === 'year') return dateStr.slice(0, 4);
  if (periodType === 'quarter') {
    const month = parseInt(dateStr.slice(5, 7), 10);
    return dateStr.slice(0, 4) + '-Q' + (Math.floor((month - 1) / 3) + 1);
  }
  return dateStr.slice(0, 7);
}

async function buildMovementReport(periodType, filters) {
  filters = filters || {};
  let allowedCodes = null;
  if (filters.category || filters.area) {
    const items = await getAllItems();
    allowedCodes = new Set(items.filter(i =>
      (!filters.category || i.category === filters.category) && (!filters.area || i.area === filters.area)
    ).map(i => i.itemCode));
  }
  const txs = await getAllTransactions();
  const byPeriod = {};
  txs.forEach(t => {
    if (allowedCodes && !allowedCodes.has(t.itemCode)) return;
    const key = periodKeyOf(t.date, periodType);
    if (!key) return;
    byPeriod[key] = byPeriod[key] || { OPENING: 0, IN: 0, OUT: 0, ADJUSTMENT: 0, RETURN: 0, DISPOSAL: 0 };
    byPeriod[key][t.type] = (byPeriod[key][t.type] || 0) + Math.abs(t.quantity);
  });
  const periods = Object.keys(byPeriod).sort().reverse();
  const headers = ['Kỳ', 'Tồn đầu', 'Nhập', 'Xuất', 'Điều chỉnh', 'Trả lại', 'Hủy bỏ', 'Tổng tiêu dùng (Xuất+Hủy)'];
  const rows = periods.map(p => {
    const v = byPeriod[p];
    return [p, fmtNum(v.OPENING), fmtNum(v.IN), fmtNum(v.OUT), fmtNum(v.ADJUSTMENT), fmtNum(v.RETURN), fmtNum(v.DISPOSAL), fmtNum(v.OUT + v.DISPOSAL)];
  });
  if (periods.length) {
    const t = periods.reduce((acc, p) => {
      const v = byPeriod[p];
      acc.OPENING += v.OPENING; acc.IN += v.IN; acc.OUT += v.OUT; acc.ADJUSTMENT += v.ADJUSTMENT; acc.RETURN += v.RETURN; acc.DISPOSAL += v.DISPOSAL;
      return acc;
    }, { OPENING: 0, IN: 0, OUT: 0, ADJUSTMENT: 0, RETURN: 0, DISPOSAL: 0 });
    rows.push(['TỔNG CỘNG', fmtNum(t.OPENING), fmtNum(t.IN), fmtNum(t.OUT), fmtNum(t.ADJUSTMENT), fmtNum(t.RETURN), fmtNum(t.DISPOSAL), fmtNum(t.OUT + t.DISPOSAL)]);
  }
  return { headers, rows };
}

      <div class="toolbar" style="margin-bottom:14px">
        <select id="mv-period-type">
          <option value="month" ${initialPeriodType === 'month' ? 'selected' : ''}>Theo tháng</option>
          <option value="quarter" ${initialPeriodType === 'quarter' ? 'selected' : ''}>Theo quý</option>
          <option value="year" ${initialPeriodType === 'year' ? 'selected' : ''}>Theo năm</option>
        </select>
        <button class="btn btn-secondary btn-sm" id="mv-excel">⭳ Xuất Excel</button>
        <button class="btn btn-secondary btn-sm" id="mv-csv">⭳ Xuất CSV</button>

        ? rows.map(r => '<tr' + (r[0] === 'TỔNG CỘNG' ? ' style="font-weight:700;background:var(--color-surface-alt)"' : '') + '>' +
            r.map((c, i) => '<td' + (i === 0 ? '' : ' class="num"') + '>' + escapeHtml(String(c)) + '</td>').join('') + '</tr>').join('')
        : emptyRow(headers.length, 'Không có dữ liệu.')) +

  out.querySelector('#mv-period-type').addEventListener('change', refresh);
