<style>
/* app.css — design system + layout + components */

:root {
  --color-primary: #0f766e;
  --color-primary-dark: #0b5c56;
  --color-primary-light: #ccfbf1;
  --color-ink: #1f2937;
  --color-ink-soft: #4b5563;
  --color-border: #e2e8f0;
  --color-bg: #f4f6f7;
  --color-surface: #ffffff;
  --color-surface-alt: #f8fafc;

  --status-normal: #16a34a;
  --status-normal-bg: #dcfce7;
  --status-reorder: #d97706;
  --status-reorder-bg: #fef3c7;
  --status-approaching: #a16207;
  --status-approaching-bg: #fefce8;
  --status-low: #ea580c;
  --status-low-bg: #ffedd5;
  --status-out: #dc2626;
  --status-out-bg: #fee2e2;
  --status-expiring: #a16207;
  --status-expiring-bg: #fef9c3;
  --status-expired: #7f1d1d;
  --status-expired-bg: #fecaca;

  --radius: 10px;
  --radius-sm: 6px;
  --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.06);
  --sidebar-width: 240px;
  --topbar-height: 60px;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--color-bg);
  color: var(--color-ink);
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, h4 { margin: 0 0 8px; font-weight: 700; }
p { margin: 0 0 8px; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }
table { border-collapse: collapse; width: 100%; }

/* ---------- shell layout ---------- */
.app-shell { display: flex; min-height: 100vh; }

.sidebar {
  width: var(--sidebar-width);
  flex-shrink: 0;
  background: linear-gradient(180deg, #0b3b3a, #0f5450);
  color: #e6fffa;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  z-index: 20;
}
.sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 18px 16px; border-bottom: 1px solid rgba(255,255,255,0.12); }
.brand-icon { font-size: 26px; }
.brand-title { font-weight: 800; font-size: 15px; letter-spacing: 0.5px; }
.brand-sub { font-size: 11px; opacity: 0.7; }

.nav-list { list-style: none; margin: 0; padding: 10px; flex: 1; }
.nav-list li { margin-bottom: 2px; }
.nav-list a {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: var(--radius-sm);
  font-size: 14.5px; font-weight: 500; color: rgba(230,255,250,0.85);
  transition: background 0.15s;
}
.nav-list a:hover { background: rgba(255,255,255,0.08); }
.nav-list a.active { background: rgba(255,255,255,0.16); color: #fff; font-weight: 700; }
.nav-icon { font-size: 17px; width: 20px; text-align: center; }
.nav-badge {
  margin-left: auto; background: var(--status-out); color: #fff; font-size: 11px; font-weight: 700;
  min-width: 18px; height: 18px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; padding: 0 5px;
}

.sidebar-footer { padding: 14px 16px; border-top: 1px solid rgba(255,255,255,0.12); font-size: 12px; }
.conn-status { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: #86efac; }
.conn-status.offline { color: #fca5a5; }

.nav-toggle {
  display: none; position: fixed; top: 10px; left: 10px; z-index: 30;
  width: 42px; height: 42px; border-radius: 8px; border: 1px solid var(--color-border);
  background: var(--color-surface); font-size: 18px; box-shadow: var(--shadow-card);
}
.nav-scrim { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 15; }

.main-area { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  height: var(--topbar-height); flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; background: var(--color-surface); border-bottom: 1px solid var(--color-border);
  position: sticky; top: 0; z-index: 10;
}
.page-title { font-size: 19px; margin: 0; }
.topbar-right { display: flex; gap: 8px; }

.app-content { padding: 20px 24px 60px; flex: 1; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid transparent; border-radius: var(--radius-sm);
  padding: 11px 16px; font-size: 14px; font-weight: 600; cursor: pointer;
  min-height: 44px; line-height: 1.1; white-space: nowrap;
  transition: filter 0.15s, background 0.15s;
}
.btn:active { filter: brightness(0.92); }
.btn-sm { padding: 8px 12px; min-height: 36px; font-size: 13px; }
.btn-xs { padding: 4px 8px; min-height: 28px; font-size: 12px; }
.btn-primary { background: var(--color-primary); color: #fff; }
.btn-primary:hover { background: var(--color-primary-dark); }
.btn-danger { background: var(--status-out); color: #fff; }
.btn-secondary { background: var(--color-surface); color: var(--color-ink); border-color: var(--color-border); }
.btn-secondary:hover { background: var(--color-surface-alt); }
.btn-ghost { background: transparent; color: var(--color-ink-soft); }
.btn-ghost:hover { background: var(--color-surface-alt); }
.btn-block { width: 100%; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }

/* ---------- cards / kpis ---------- */
.card {
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius); box-shadow: var(--shadow-card); padding: 18px;
}
.card + .card { margin-top: 16px; }
.section-title { font-size: 15px; font-weight: 700; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }

.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
.kpi-card {
  background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius);
  padding: 16px 18px; box-shadow: var(--shadow-card); cursor: pointer; transition: transform 0.1s, box-shadow 0.1s;
}
.kpi-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(15,23,42,0.10); }
.kpi-value { font-size: 28px; font-weight: 800; line-height: 1.1; }
.kpi-label { font-size: 12.5px; color: var(--color-ink-soft); margin-top: 4px; font-weight: 600; }
.kpi-card.accent-danger .kpi-value { color: var(--status-out); }
.kpi-card.accent-warn .kpi-value { color: var(--status-reorder); }
.kpi-card.accent-primary .kpi-value { color: var(--color-primary); }

/* ---------- alert list ---------- */
.alert-item {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px;
  border: 1px solid var(--color-border); border-radius: var(--radius-sm); margin-bottom: 8px;
  background: var(--color-surface); cursor: pointer;
}
.alert-item:hover { background: var(--color-surface-alt); }
.alert-icon { font-size: 18px; }
.alert-body { flex: 1; min-width: 0; }
.alert-title { font-weight: 700; font-size: 13px; }
.alert-sub { font-size: 12.5px; color: var(--color-ink-soft); }
.alert-item.sev-out { border-left: 4px solid var(--status-out); }
.alert-item.sev-reorder { border-left: 4px solid var(--status-reorder); }
.alert-item.sev-approaching { border-left: 4px dashed var(--status-approaching); }
.alert-item.sev-expiring { border-left: 4px solid var(--status-expiring); }
.alert-item.sev-expired { border-left: 4px solid var(--status-expired); }

/* ---------- badges ---------- */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.badge-normal { background: var(--status-normal-bg); color: var(--status-normal); }
.badge-reorder { background: var(--status-reorder-bg); color: var(--status-reorder); }
.badge-approaching { background: var(--status-approaching-bg); color: var(--status-approaching); border: 1px dashed var(--status-approaching); }
.badge-low { background: var(--status-low-bg); color: var(--status-low); }
.badge-out { background: var(--status-out-bg); color: var(--status-out); }
.badge-expiring { background: var(--status-expiring-bg); color: var(--status-expiring); }
.badge-expired { background: var(--status-expired-bg); color: var(--status-expired); }
.badge-neutral { background: var(--color-surface-alt); color: var(--color-ink-soft); border: 1px solid var(--color-border); }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--color-border); border-radius: var(--radius); background: var(--color-surface); }
table.data-table { min-width: 640px; }
.data-table th {
  text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.4px;
  color: var(--color-ink-soft); background: var(--color-surface-alt); padding: 10px 12px;
  border-bottom: 1px solid var(--color-border); position: sticky; top: 0; white-space: nowrap;
}
.data-table td { padding: 10px 12px; border-bottom: 1px solid var(--color-border); font-size: 13.5px; vertical-align: middle; }
.data-table tbody tr:hover { background: var(--color-surface-alt); }
.data-table tbody tr:last-child td { border-bottom: none; }
.data-table .num { text-align: right; font-variant-numeric: tabular-nums; }
.row-link { cursor: pointer; }
.empty-row td { text-align: center; padding: 32px; color: var(--color-ink-soft); }

/* ---------- forms ---------- */
.form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 18px; }
.form-field { display: flex; flex-direction: column; gap: 6px; }
.form-field.full { grid-column: 1 / -1; }
.form-field label { font-size: 13px; font-weight: 600; color: var(--color-ink-soft); }
.form-field label .req { color: var(--status-out); }
input, select, textarea {
  font-family: inherit; font-size: 14.5px; padding: 11px 12px; border: 1px solid var(--color-border);
  border-radius: var(--radius-sm); background: var(--color-surface); color: var(--color-ink);
  min-height: 44px; width: 100%;
}
textarea { min-height: 80px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--color-primary); outline-offset: 1px; border-color: var(--color-primary); }
input.invalid, select.invalid { border-color: var(--status-out); }
.field-error { color: var(--status-out); font-size: 12px; }
.field-hint { color: var(--color-ink-soft); font-size: 12px; }
.form-actions { display: flex; gap: 10px; margin-top: 18px; justify-content: flex-end; }
.checkbox-row { display: flex; align-items: center; gap: 8px; }
.checkbox-row input { width: auto; min-height: auto; }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; align-items: center; }
.toolbar .grow { flex: 1; min-width: 180px; }
.toolbar > select, .toolbar > input:not(.grow input) { width: auto; flex: 0 0 auto; min-width: 130px; }
.toolbar > input[type="date"] { min-width: 150px; }
.toolbar > input[type="file"] { min-width: 0; }
.search-box { position: relative; }
.search-box input { width: 100%; }

.item-combobox { position: relative; }
.item-combobox-list {
  position: absolute; z-index: 40; top: calc(100% + 4px); left: 0; right: 0; max-height: 260px; overflow-y: auto;
  background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-sm); box-shadow: var(--shadow-card);
}
.item-combobox-opt { padding: 8px 12px; font-size: 13.5px; cursor: pointer; }
.item-combobox-opt:hover, .item-combobox-opt.active { background: var(--color-primary-light); }
.item-combobox-opt strong { color: var(--color-primary-dark); }
.item-combobox-empty { padding: 8px 12px; font-size: 13px; color: var(--color-ink-soft); }

.info-banner {
  display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius-sm);
  background: var(--color-primary-light); color: var(--color-primary-dark); font-size: 13.5px; margin-bottom: 16px;
}
.info-banner.warn { background: var(--status-reorder-bg); color: #92400e; }
.info-banner.danger { background: var(--status-out-bg); color: #991b1b; }

/* ---------- modal ---------- */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(15,23,42,0.5); display: flex;
  align-items: center; justify-content: center; z-index: 100; padding: 16px;
}
.modal-box {
  background: var(--color-surface); border-radius: var(--radius); box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; padding: 22px;
}
.modal-box.wide { max-width: 820px; }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--color-ink-soft); }

/* ---------- toast ---------- */
#toast-host { position: fixed; bottom: 18px; right: 18px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--color-ink); color: #fff; padding: 12px 16px; border-radius: var(--radius-sm);
  font-size: 13.5px; box-shadow: 0 6px 16px rgba(0,0,0,0.2); opacity: 0; transform: translateY(8px);
  transition: opacity 0.25s, transform 0.25s; max-width: 320px;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast-success { background: #14532d; }
.toast-error { background: #7f1d1d; }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--color-border); margin-bottom: 16px; flex-wrap: wrap; }
.tab-btn { padding: 10px 16px; border: none; background: none; font-weight: 600; font-size: 13.5px; color: var(--color-ink-soft); cursor: pointer; border-bottom: 2px solid transparent; }
.tab-btn.active { color: var(--color-primary); border-bottom-color: var(--color-primary); }

.quick-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }

.pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 12px; font-size: 13px; }

.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; }
.detail-grid .k { color: var(--color-ink-soft); font-size: 12.5px; }
.detail-grid .v { font-weight: 600; font-size: 14px; }

.lot-fefo-hint { background: var(--status-normal-bg); color: #14532d; padding: 10px 12px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 10px; }

.qr-box { display: flex; align-items: center; gap: 14px; }

.report-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.report-tile { padding: 16px; border: 1px solid var(--color-border); border-radius: var(--radius); background: var(--color-surface); cursor: pointer; }
.report-tile:hover { border-color: var(--color-primary); }
.report-tile .rt-icon { font-size: 22px; }
.report-tile .rt-title { font-weight: 700; font-size: 13.5px; margin-top: 6px; }

@media print {
  .sidebar, .topbar, .nav-toggle, .toolbar, .form-actions, #toast-host, .quick-actions { display: none !important; }
  .app-content { padding: 0; }
  body { background: #fff; }
}


/* responsive.css — tablet (Galaxy Tab A9, ~800-1340px) and mobile breakpoints */

@media (max-width: 1100px) {
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .report-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 960px) {
  .nav-toggle { display: flex; align-items: center; justify-content: center; }
  .sidebar {
    position: fixed; left: 0; top: 0; height: 100%;
    transform: translateX(-100%); transition: transform 0.2s ease;
  }
  .sidebar.open { transform: translateX(0); }
  .nav-scrim.open { display: block; }
  .main-area { width: 100%; }
  .topbar { padding-left: 60px; }
  .page-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .form-grid { grid-template-columns: 1fr; }
  .detail-grid { grid-template-columns: 1fr; }
}

@media (max-width: 720px) {
  .kpi-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .kpi-value { font-size: 22px; }
  .app-content { padding: 14px 12px 50px; }
  .topbar { padding: 0 10px 0 56px; gap: 6px; }
  .modal-box { padding: 16px; }
  .report-grid { grid-template-columns: 1fr; }
  .page-title { font-size: 15px; flex: 1; }
  .topbar-right { flex-shrink: 0; gap: 6px; }
  .topbar-right .btn { padding: 9px 10px; font-size: 12.5px; }
  .topbar-right .btn .btn-label { display: none; }
}

@media (max-width: 480px) {
  .kpi-grid { grid-template-columns: 1fr 1fr; }
  .form-actions { flex-direction: column-reverse; }
  .form-actions .btn { width: 100%; }
}

/* touch target comfort on coarse pointers (tablets/phones) */
@media (pointer: coarse) {
  .btn, input, select, textarea, .nav-list a { min-height: 46px; }
  .data-table td, .data-table th { padding: 12px 10px; }
}

</style>
</head>

<div class="app-shell">

  <button id="nav-toggle" class="nav-toggle" aria-label="Mở menu">☰</button>

  <nav id="sidebar" class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-icon">🧪</span>
      <div>
        <div class="brand-title">QA STOCK</div>
        <div class="brand-sub">Quản lý kho</div>
      </div>
    </div>
    <ul class="nav-list" id="nav-list">
      <li><a href="#/dashboard" data-route="dashboard"><span class="nav-icon">🏠</span><span>Tổng quan</span></a></li>
      <li><a href="#/inventory" data-route="inventory"><span class="nav-icon">📦</span><span>Tồn kho</span></a></li>

<script>
/* ================= utils.js ================= */
// utils.js — shared helpers, no dependencies.
'use strict';

function uid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

function todayISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function nowISO() {
  return new Date().toISOString();
}

// dd/mm/yyyy for display, accepts 'yyyy-mm-dd' or ISO datetime or Date
function fmtDate(value) {
  if (!value) return '';
  let d;
  if (value instanceof Date) d = value;
  else d = new Date(value);
  if (isNaN(d.getTime())) return String(value);
  return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
}

function fmtDateTime(value) {
  if (!value) return '';
  const d = new Date(value);
  if (isNaN(d.getTime())) return String(value);
  return fmtDate(d) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function daysBetween(a, b) {
  const da = new Date(a); const db_ = new Date(b);
  if (isNaN(da.getTime()) || isNaN(db_.getTime())) return NaN;
  const MS = 24 * 60 * 60 * 1000;
  return Math.round((db_.setHours(0, 0, 0, 0) - da.setHours(0, 0, 0, 0)) / MS);
}

function addDays(dateStr, days) {
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return null;
  d.setDate(d.getDate() + Number(days));
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function fmtNum(n) {
  if (n === null || n === undefined || isNaN(n)) return '0';
  return Number(n).toLocaleString('en-US', { maximumFractionDigits: 3 });
}

function debounce(fn, wait) {
  let t;
  return function (...args) {
    clearTimeout(t);
    t = setTimeout(() => fn.apply(this, args), wait);
  };
}

function el(tag, attrs, children) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      if (k === 'class') node.className = attrs[k];
      else if (k === 'html') node.innerHTML = attrs[k];
      else if (k.startsWith('on') && typeof attrs[k] === 'function') node.addEventListener(k.slice(2), attrs[k]);
      else node.setAttribute(k, attrs[k]);
    }
  }
  if (children) {
    (Array.isArray(children) ? children : [children]).forEach(c => {
      if (c === null || c === undefined) return;
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
  }
  return node;
}

// Excel-error strings that must never be imported as real data.
const EXCEL_ERROR_TOKENS = ['#REF!', '#N/A', '#VALUE!', '#DIV/0!', '#NAME?', '#NULL!', '#NUM!'];
function isExcelError(value) {
  if (value === null || value === undefined) return false;
  return EXCEL_ERROR_TOKENS.includes(String(value).trim());
}

// --- CSV helpers (Excel-compatible, UTF-8 BOM for Vietnamese text) ---
function toCsvValue(v) {
  if (v === null || v === undefined) return '';
  const s = String(v);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function rowsToCsv(headers, rows) {
  const lines = [headers.map(toCsvValue).join(',')];
  rows.forEach(r => lines.push(r.map(toCsvValue).join(',')));
  return lines.join('\r\n');
}

function downloadBlob(filename, blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function downloadFile(filename, content, mime) {
  const BOM = mime && mime.indexOf('csv') !== -1 ? '﻿' : '';
  const blob = new Blob([BOM + content], { type: mime || 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

// Minimal CSV parser supporting quoted fields with embedded commas/newlines.
function parseCsv(text) {
  text = text.replace(/^﻿/, '');
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\r') { /* skip */ }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => !(r.length === 1 && r[0] === ''));
}

function csvToObjects(text) {
  const rows = parseCsv(text);
  if (!rows.length) return [];
  const headers = rows[0].map(h => h.trim());
  return rows.slice(1).map(r => {
    const o = {};
    headers.forEach((h, i) => { o[h] = r[i] !== undefined ? r[i] : ''; });
    return o;
  });
}

function toast(message, type) {
  let host = document.getElementById('toast-host');
  if (!host) {
    host = document.createElement('div');
    host.id = 'toast-host';
    document.body.appendChild(host);
  }
  const t = document.createElement('div');
  t.className = 'toast toast-' + (type || 'info');
  t.textContent = message;
  host.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3500);
}

function confirmDialog(message) {
  return window.confirm(message);
}

// App mode (demo vs production) — stored in localStorage, NOT IndexedDB, so it survives
// "Clear All Local Data" and correctly stops the app from silently reseeding demo data
// into what the user intended to be an empty production database.
const APP_MODE_KEY = 'qa_stock_app_mode';

function getAppMode() {
  try { return localStorage.getItem(APP_MODE_KEY); } catch (e) { return null; }
}

function setAppMode(mode) {
  try {
    if (mode) localStorage.setItem(APP_MODE_KEY, mode);
    else localStorage.removeItem(APP_MODE_KEY);
  } catch (e) { /* localStorage unavailable (private mode, etc.) — non-fatal */ }
}


/* ================= db.js ================= */
// db.js — IndexedDB access layer. Every other module reads/writes through here.
'use strict';

const DB_NAME = 'qa_stock_db';
const DB_VERSION = 1;

const STORES = {
  items: 'items',
  transactions: 'transactions',
  stockLots: 'stockLots',
  stockTakes: 'stockTakes',
  stockTakeLines: 'stockTakeLines',
  settings: 'settings',
  auditLog: 'auditLog'
};

let _dbPromise = null;

function openDB() {
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = req.result;

      if (!db.objectStoreNames.contains(STORES.items)) {
        const s = db.createObjectStore(STORES.items, { keyPath: 'id' });
        s.createIndex('itemCode', 'itemCode', { unique: true });
        s.createIndex('category', 'category', { unique: false });
        s.createIndex('active', 'active', { unique: false });
        s.createIndex('location', 'location', { unique: false });
      }

      if (!db.objectStoreNames.contains(STORES.transactions)) {
        const s = db.createObjectStore(STORES.transactions, { keyPath: 'id' });
        s.createIndex('itemCode', 'itemCode', { unique: false });
        s.createIndex('type', 'type', { unique: false });
        s.createIndex('date', 'date', { unique: false });
        s.createIndex('lotNo', 'lotNo', { unique: false });
        s.createIndex('transactionNo', 'transactionNo', { unique: true });
        s.createIndex('itemCode_date', ['itemCode', 'date'], { unique: false });
      }

      if (!db.objectStoreNames.contains(STORES.stockLots)) {
        const s = db.createObjectStore(STORES.stockLots, { keyPath: 'id' });
        s.createIndex('itemCode', 'itemCode', { unique: false });
        s.createIndex('itemCode_lotNo', ['itemCode', 'lotNo'], { unique: true });
        s.createIndex('status', 'status', { unique: false });
        s.createIndex('expiryDate', 'expiryDate', { unique: false });
      }

      if (!db.objectStoreNames.contains(STORES.stockTakes)) {
        const s = db.createObjectStore(STORES.stockTakes, { keyPath: 'id' });
        s.createIndex('date', 'date', { unique: false });
        s.createIndex('status', 'status', { unique: false });
      }

      if (!db.objectStoreNames.contains(STORES.stockTakeLines)) {
        const s = db.createObjectStore(STORES.stockTakeLines, { keyPath: 'id' });
        s.createIndex('stockTakeId', 'stockTakeId', { unique: false });
      }

      if (!db.objectStoreNames.contains(STORES.settings)) {
        db.createObjectStore(STORES.settings, { keyPath: 'id' });
      }

      if (!db.objectStoreNames.contains(STORES.auditLog)) {
        const s = db.createObjectStore(STORES.auditLog, { keyPath: 'id' });
        s.createIndex('timestamp', 'timestamp', { unique: false });
      }
    };
    req.onsuccess = () => {
      const db = req.result;
      // If the connection ever closes unexpectedly (e.g. a future version-change from another
      // tab), forget the cached promise so the next openDB() call reopens a fresh connection
      // instead of every subsequent tx() failing forever with "connection is closing".
      db.onclose = () => { _dbPromise = null; };
      resolve(db);
    };
    req.onerror = () => reject(req.error);
  });
  return _dbPromise;
}

function tx(storeNames, mode) {
  return openDB().then(db => db.transaction(storeNames, mode));
}

function reqToPromise(req) {
  return new Promise((resolve, reject) => {
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function txDone(t) {
  return new Promise((resolve, reject) => {
    t.oncomplete = () => resolve();
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error || new Error('Transaction aborted'));
  });
}

async function dbGetAll(store) {
  const t = await tx(store, 'readonly');
  return reqToPromise(t.objectStore(store).getAll());
}

async function dbGet(store, id) {
  const t = await tx(store, 'readonly');
  return reqToPromise(t.objectStore(store).get(id));
}

async function dbGetByIndex(store, indexName, value) {
  const t = await tx(store, 'readonly');
  return reqToPromise(t.objectStore(store).index(indexName).get(value));
}

async function dbGetAllByIndex(store, indexName, value) {
  const t = await tx(store, 'readonly');
  return reqToPromise(t.objectStore(store).index(indexName).getAll(value));
}

async function dbPut(store, obj) {
  const t = await tx(store, 'readwrite');
  t.objectStore(store).put(obj);
  await txDone(t);
  return obj;
}

async function dbAdd(store, obj) {
  const t = await tx(store, 'readwrite');
  t.objectStore(store).add(obj);
  await txDone(t);
  return obj;
}

async function dbDelete(store, id) {
  const t = await tx(store, 'readwrite');
  t.objectStore(store).delete(id);
  await txDone(t);
}

async function dbClear(store) {
  const t = await tx(store, 'readwrite');
  t.objectStore(store).clear();
  await txDone(t);
}

async function dbCount(store) {
  const t = await tx(store, 'readonly');
  return reqToPromise(t.objectStore(store).count());
}

// ---- Settings (single row, id "app") ----
const DEFAULT_SETTINGS = {
  id: 'app',
  appName: 'QA Stock Management',
  companySite: 'ILD Coffee Vietnam',
  defaultUser: '',
  dateFormat: 'dd/mm/yyyy',
  expiryWarningDays: 30,
  earlyWarningPercent: 20,
  theme: 'light',
  allowNegativeStock: false,
  picList: [],
  counters: { transactionSeq: 0, stockTakeSeq: 0 }
};

async function getSettings() {
  const s = await dbGet(STORES.settings, 'app');
  if (!s) {
    await dbPut(STORES.settings, DEFAULT_SETTINGS);
    return { ...DEFAULT_SETTINGS };
  }
  return { ...DEFAULT_SETTINGS, ...s, counters: { ...DEFAULT_SETTINGS.counters, ...(s.counters || {}) } };
}

async function saveSettings(patch) {
  const current = await getSettings();
  const merged = { ...current, ...patch };
  await dbPut(STORES.settings, merged);
  return merged;
}

async function nextSeq(counterName, prefix, pad) {
  const t = await tx(STORES.settings, 'readwrite');
  const store = t.objectStore(STORES.settings);
  let s = await reqToPromise(store.get('app'));
  if (!s) s = { ...DEFAULT_SETTINGS };
  if (!s.counters) s.counters = { transactionSeq: 0, stockTakeSeq: 0 };
  s.counters[counterName] = (s.counters[counterName] || 0) + 1;
  const seq = s.counters[counterName];
  store.put(s);
  await txDone(t);
  return prefix + '-' + String(seq).padStart(pad || 6, '0');
}

async function logAudit(action, entity, entityId, user, description) {
  await dbAdd(STORES.auditLog, {
    id: uid(),
    timestamp: nowISO(),
    action, entity, entityId,
    user: user || (await getSettings()).defaultUser || 'system',
    description: description || ''
  });
}

// ---- Items ----
async function getAllItems() {
  return dbGetAll(STORES.items);
}

async function getItemByCode(itemCode) {
  return dbGetByIndex(STORES.items, 'itemCode', itemCode);
}

async function saveItem(item, user) {
  const existing = item.id ? await dbGet(STORES.items, item.id) : null;
  const now = nowISO();
  if (!existing) {
    const dup = await getItemByCode(item.itemCode);
    if (dup) throw new Error('Mã hàng "' + item.itemCode + '" đã tồn tại.');
    item.id = item.id || uid();
    item.createdAt = now;
    item.updatedAt = now;
    if (item.active === undefined) item.active = true;
    await dbAdd(STORES.items, item);
    await logAudit('CREATE_ITEM', 'items', item.id, user, 'Created item ' + item.itemCode);
  } else {
    if (existing.itemCode !== item.itemCode) {
      const dup = await getItemByCode(item.itemCode);
      if (dup && dup.id !== item.id) throw new Error('Mã hàng "' + item.itemCode + '" đã tồn tại.');
    }
    item.createdAt = existing.createdAt;
    item.updatedAt = now;
    await dbPut(STORES.items, item);
    await logAudit('UPDATE_ITEM', 'items', item.id, user, 'Updated item ' + item.itemCode);
  }
  return item;
}

async function setItemActive(id, active, user) {
  const item = await dbGet(STORES.items, id);
  if (!item) return;
  item.active = active;
  item.updatedAt = nowISO();
  await dbPut(STORES.items, item);
  await logAudit(active ? 'ACTIVATE_ITEM' : 'DEACTIVATE_ITEM', 'items', id, user, (active ? 'Activated ' : 'Deactivated ') + item.itemCode);
}

// ---- Transactions & lots (the core transactional engine) ----

// signedQty > 0 increases balance, < 0 decreases. type stored as given.
function signedQuantity(type, quantity) {
  if (type === 'OPENING' || type === 'IN' || type === 'RETURN') return Math.abs(quantity);
  if (type === 'OUT' || type === 'DISPOSAL') return -Math.abs(quantity);
  if (type === 'ADJUSTMENT') return quantity; // already signed by caller
  return 0;
}

async function getBalance(itemCode) {
  const rows = await dbGetAllByIndex(STORES.transactions, 'itemCode', itemCode);
  return rows.reduce((sum, r) => sum + signedQuantity(r.type, r.quantity), 0);
}

async function getAllTransactions() {
  return dbGetAll(STORES.transactions);
}

async function getTransactionsForItem(itemCode) {
  const rows = await dbGetAllByIndex(STORES.transactions, 'itemCode', itemCode);
  return rows.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (a.createdAt < b.createdAt ? 1 : -1)));
}

async function getLotsForItem(itemCode) {
  return dbGetAllByIndex(STORES.stockLots, 'itemCode', itemCode);
}

function recomputeLotStatus(lot, expiryWarningDays) {
  if (lot.quantity <= 0) return lot.status === 'DISPOSED' ? 'DISPOSED' : 'DEPLETED';
  const effectiveExpiry = lot.openedExpiryDate && (!lot.expiryDate || lot.openedExpiryDate < lot.expiryDate)
    ? lot.openedExpiryDate : lot.expiryDate;
  if (effectiveExpiry) {
    const d = daysBetween(todayISO(), effectiveExpiry);
    if (d < 0) return 'EXPIRED';
  }
  return 'ACTIVE';
}

// Core atomic write: one transaction row + lot maintenance, single IDB transaction.
// Negative-stock / negative-lot enforcement is performed INSIDE this same IDB transaction
// (re-reading the current balance/lot fresh, not from a value the caller computed earlier) so
// two concurrent writers (e.g. two open tabs, or a double-click) cannot both pass a stale
// pre-check and drive stock negative. If this throws, no record and no lot mutation is written.
async function postTransaction(txData, user) {
  const settings = await getSettings();
  const db = await openDB();
  const idbTx = db.transaction([STORES.transactions, STORES.stockLots, STORES.settings, STORES.items], 'readwrite');
  const txStore = idbTx.objectStore(STORES.transactions);
  const lotStore = idbTx.objectStore(STORES.stockLots);
  const settingsStore = idbTx.objectStore(STORES.settings);

  const quantity = txData.type === 'ADJUSTMENT' ? txData.quantity : Math.abs(txData.quantity); // ADJUSTMENT is signed by the caller
  const delta = signedQuantity(txData.type, quantity);
  const lotNo = txData.lotNo || null;

  if (delta < 0 && !settings.allowNegativeStock) {
    const itemTxRows = await reqToPromise(txStore.index('itemCode').getAll(txData.itemCode));
    const currentBalance = itemTxRows.reduce((sum, r) => sum + signedQuantity(r.type, r.quantity), 0);
    if (currentBalance + delta < -1e-9) {
      idbTx.abort();
      throw new Error('Không đủ tồn kho cho ' + txData.itemCode + ' (hiện có ' + currentBalance + ', cần trừ ' + Math.abs(delta) + ').');
    }
    if (lotNo) {
      const existingLotCheck = await reqToPromise(lotStore.index('itemCode_lotNo').get([txData.itemCode, lotNo]));
      const lotBalance = existingLotCheck ? existingLotCheck.quantity : 0;
      if (lotBalance + delta < -1e-9) {
        idbTx.abort();
        throw new Error('Không đủ tồn trong lô ' + lotNo + ' (hiện có ' + lotBalance + ', cần trừ ' + Math.abs(delta) + ').');
      }
    }
  }

  // sequence number inline (same transaction, avoids race with nextSeq's own tx)
  let s = await reqToPromise(settingsStore.get('app'));
  if (!s) s = { ...DEFAULT_SETTINGS };
  if (!s.counters) s.counters = { transactionSeq: 0, stockTakeSeq: 0 };
  s.counters.transactionSeq = (s.counters.transactionSeq || 0) + 1;
  const transactionNo = 'TX-' + String(s.counters.transactionSeq).padStart(6, '0');
  settingsStore.put(s);

  const record = {
    id: uid(),
    transactionNo,
    date: txData.date,
    timestamp: nowISO(),
    type: txData.type,
    itemCode: txData.itemCode,
    quantity,
    unit: txData.unit || '',
    lotNo,
    expiryDate: txData.expiryDate || null,
    openedDate: txData.openedDate || null,
    openedExpiryDate: txData.openedExpiryDate || null,
    supplier: txData.supplier || '',
    supplierCode: txData.supplierCode || '',
    purpose: txData.purpose || '',
    issuedTo: txData.issuedTo || '',
    user: user || settings.defaultUser || 'system',
    note: txData.note || '',
    referenceNo: txData.referenceNo || '',
    createdAt: nowISO()
  };

  txStore.add(record);

  // Maintain lot record if a lot number is involved
  if (record.lotNo) {
    const lotIndex = lotStore.index('itemCode_lotNo');
    const existingLot = await reqToPromise(lotIndex.get([record.itemCode, record.lotNo]));
    const delta = signedQuantity(record.type, record.quantity);
    let lot = existingLot;
    if (!lot) {
      lot = {
        id: uid(),
        itemCode: record.itemCode,
        lotNo: record.lotNo,
        expiryDate: record.expiryDate || null,
        openedDate: record.openedDate || null,
        openedExpiryDate: record.openedExpiryDate || null,
        quantity: 0,
        supplier: record.supplier || '',
        status: 'ACTIVE'
      };
    }
    lot.quantity = (lot.quantity || 0) + delta;
    if (record.expiryDate) lot.expiryDate = record.expiryDate;
    if (record.openedDate) lot.openedDate = record.openedDate;
    if (record.openedExpiryDate) lot.openedExpiryDate = record.openedExpiryDate;
    if (record.supplier) lot.supplier = record.supplier;
    if (record.type === 'DISPOSAL' && lot.quantity <= 0) lot.status = 'DISPOSED';
    else lot.status = recomputeLotStatus(lot, settings.expiryWarningDays);
    lotStore.put(lot);
  }

  await txDone(idbTx);
  await logAudit(txData.type, 'transactions', record.id, record.user,
    txData.type + ' ' + record.quantity + ' ' + record.unit + ' of ' + record.itemCode + (record.lotNo ? ' (lot ' + record.lotNo + ')' : ''));
  return record;
}

// ---- Metadata edits (audited, whitelisted) ----
// A deliberate, narrow exception to "transactions/lots are append-only": only fields that
// DESCRIBE a record (not the quantity, item, type, or date that DETERMINE the ledger) can be
// corrected after the fact, and only with a reason + audit trail. Balance-affecting corrections
// still have to go through postTransaction('ADJUSTMENT', ...).

// Lot-level facts (lot number, expiry, supplier) are shared by every transaction that built or
// drew from that lot, so editing them here also re-syncs every sibling transaction — otherwise
// "Thông tin lô hàng" and "Lịch sử giao dịch" would show two different lot numbers for the same
// physical batch.
async function updateLotMetadata(lotId, patch, reason, editedBy) {
  if (!reason || !reason.trim()) throw new Error('Vui lòng nhập lý do sửa.');
  const db = await openDB();
  const idbTx = db.transaction([STORES.stockLots, STORES.transactions], 'readwrite');
  const lotStore = idbTx.objectStore(STORES.stockLots);
  const txStore = idbTx.objectStore(STORES.transactions);

  const lot = await reqToPromise(lotStore.get(lotId));
  if (!lot) { idbTx.abort(); throw new Error('Không tìm thấy lô hàng.'); }

  const fields = ['lotNo', 'expiryDate', 'supplier'];
  const changes = [];
  const applied = {};
  for (const key of fields) {
    if (!(key in patch)) continue;
    const newVal = patch[key] || null;
    const oldVal = lot[key] || null;
    if (oldVal === newVal) continue;
    applied[key] = newVal;
    changes.push(key + ': "' + (oldVal || '—') + '" → "' + (newVal || '—') + '"');
  }
  if (!changes.length) { idbTx.abort(); return lot; }

  const oldLotNo = lot.lotNo;
  if ('lotNo' in applied) {
    const clash = await reqToPromise(lotStore.index('itemCode_lotNo').get([lot.itemCode, applied.lotNo]));
    if (clash && clash.id !== lot.id) { idbTx.abort(); throw new Error('Lô "' + applied.lotNo + '" đã tồn tại cho mặt hàng này.'); }
  }

  Object.assign(lot, applied);
  lotStore.put(lot);

  const siblings = await reqToPromise(txStore.index('lotNo').getAll(oldLotNo));
  for (const sib of siblings) {
    if (sib.itemCode !== lot.itemCode) continue;
    let changed = false;
    if ('lotNo' in applied) { sib.lotNo = applied.lotNo; changed = true; }
    if ('expiryDate' in applied) { sib.expiryDate = applied.expiryDate; changed = true; }
    if ('supplier' in applied) { sib.supplier = applied.supplier || ''; changed = true; }
    if (changed) txStore.put(sib);
  }

  await txDone(idbTx);
  await logAudit('EDIT_LOT', 'stockLots', lot.id, editedBy,
    'Sửa lô ' + (oldLotNo || '') + ' của ' + lot.itemCode + ': ' + changes.join('; ') + '. Lý do: ' + reason);
  return lot;
}

// Fields that live only on the single transaction that recorded them (no other record needs
// to stay in sync): the PO/reference number, the supplier's own product code, a note, and who
// carried it out.
const TX_METADATA_FIELDS = ['referenceNo', 'supplierCode', 'note', 'user'];

async function updateTransactionMetadata(txId, patch, reason, editedBy) {
  if (!reason || !reason.trim()) throw new Error('Vui lòng nhập lý do sửa.');
  const record = await dbGet(STORES.transactions, txId);
  if (!record) throw new Error('Không tìm thấy giao dịch.');
  const changes = [];
  for (const key of TX_METADATA_FIELDS) {
    if (!(key in patch)) continue;
    const newVal = patch[key] || '';
    const oldVal = record[key] || '';
    if (oldVal === newVal) continue;
    changes.push(key + ': "' + (oldVal || '—') + '" → "' + (newVal || '—') + '"');
    record[key] = newVal;
  }
  if (!changes.length) return record;
  await dbPut(STORES.transactions, record);
  await logAudit('EDIT_TX_METADATA', 'transactions', record.id, editedBy,
    'Sửa giao dịch ' + record.transactionNo + ': ' + changes.join('; ') + '. Lý do: ' + reason);
  return record;
}

async function clearAllData() {

const BACKUP_SCHEMA_VERSION = 1;

async function exportAllData() {
  const data = { _meta: { schemaVersion: BACKUP_SCHEMA_VERSION, exportedAt: nowISO(), dbVersion: DB_VERSION } };
  for (const s of Object.values(STORES)) data[s] = await dbGetAll(s);
  return data;
}

function validateBackupShape(data) {
  if (!data || typeof data !== 'object' || Array.isArray(data)) {
    throw new Error('File sao lưu không hợp lệ: không đúng định dạng JSON.');
  }
  const hasAnyKnownStore = Object.values(STORES).some(s => Array.isArray(data[s]));
  if (!hasAnyKnownStore) {
    throw new Error('File sao lưu không hợp lệ: không tìm thấy dữ liệu nào khớp với cấu trúc QA Stock Management.');
  }
  for (const storeName of Object.values(STORES)) {
    const rows = data[storeName];
    if (!Array.isArray(rows)) continue;
    if (rows.some(r => !r || typeof r !== 'object' || r.id === undefined || r.id === null)) {
      throw new Error('File sao lưu không hợp lệ: có bản ghi trong "' + storeName + '" thiếu id.');
    }
  }
}

// Restores a previously exported backup. 'replace' wipes everything first (internally
// consistent since it came from one export snapshot). 'merge' writes on top of current data but
// never lets the settings counters (transactionSeq/stockTakeSeq) regress — restoring an older
// backup on top of a database that has since grown would otherwise hand out transactionNo /
// stockTakeNo values that already exist, which the unique index would then reject on next use.
async function importAllData(data, mode) {
  validateBackupShape(data);
  if (mode === 'replace') await clearAllData();
  const currentSettings = mode === 'merge' ? await getSettings() : null;

  for (const storeName of Object.values(STORES)) {
    const rows = data[storeName];
    if (!Array.isArray(rows)) continue;
    const t = await tx(storeName, 'readwrite');
    const store = t.objectStore(storeName);
    rows.forEach(row => {
      let r = row;
      if (storeName === STORES.settings && currentSettings && r.id === 'app') {
        const incoming = r.counters || {};
        const current = currentSettings.counters || {};
        r = { ...r, counters: {
          transactionSeq: Math.max(incoming.transactionSeq || 0, current.transactionSeq || 0),
          stockTakeSeq: Math.max(incoming.stockTakeSeq || 0, current.stockTakeSeq || 0)
        } };
      }
      store.put(r);
    });
    await txDone(t);
  }
}

// inventory-engine.js — pure business-logic functions shared across screens.
// No DOM, no IndexedDB calls here except where explicitly noted as an aggregate builder.
'use strict';

const STATUS_ORDER = ['OUT_OF_STOCK', 'LOW_STOCK', 'REORDER', 'NORMAL'];

const STATUS_META = {
  NORMAL: { label: 'Bình thường', icon: '🟢', badgeClass: 'badge-normal' },
  REORDER: { label: 'Cần đặt hàng', icon: '🟠', badgeClass: 'badge-reorder' },
  LOW_STOCK: { label: 'Tồn thấp', icon: '🔴', badgeClass: 'badge-low' },
  OUT_OF_STOCK: { label: 'Hết hàng', icon: '⛔', badgeClass: 'badge-out' }
};

const EXPIRY_META = {
  NORMAL: { label: '—', icon: '', badgeClass: '' },
  EXPIRING_SOON: { label: 'Sắp hết hạn', icon: '⚠️', badgeClass: 'badge-expiring' },
  EXPIRED: { label: 'Đã hết hạn', icon: '❌', badgeClass: 'badge-expired' }
};

function computeStockStatus(balance, minimumStock, reorderPoint) {
  if (balance <= 0) return 'OUT_OF_STOCK';
  if (minimumStock !== undefined && minimumStock !== null && balance <= minimumStock) return 'LOW_STOCK';
  if (reorderPoint !== undefined && reorderPoint !== null && balance <= reorderPoint) return 'REORDER';
  return 'NORMAL';
}

function effectiveExpiry(lot) {
  if (!lot) return null;
  if (lot.openedExpiryDate && (!lot.expiryDate || lot.openedExpiryDate < lot.expiryDate)) return lot.openedExpiryDate;
  return lot.expiryDate || null;
}

function computeExpiryStatus(lot, warningDays) {
  const exp = effectiveExpiry(lot);
  if (!exp) return 'NORMAL';
  const d = daysBetween(todayISO(), exp);
  if (d < 0) return 'EXPIRED';
  if (d <= (warningDays || 30)) return 'EXPIRING_SOON';
  return 'NORMAL';
}

// Earliest-expiry-first recommendation among ACTIVE lots with quantity > 0.
function recommendFefoLot(lots) {
  const candidates = (lots || []).filter(l => l.status !== 'DISPOSED' && l.status !== 'DEPLETED' && l.quantity > 0);
  if (!candidates.length) return null;
  return candidates.slice().sort((a, b) => {
    const ea = effectiveExpiry(a), eb = effectiveExpiry(b);
    if (!ea && !eb) return 0;
    if (!ea) return 1;
    if (!eb) return -1;
    return ea < eb ? -1 : ea > eb ? 1 : 0;
  })[0];
}

function computeOpenedExpiryDate(openedDate, openedExpiryDays) {
  if (!openedDate || !openedExpiryDays) return null;
  return addDays(openedDate, openedExpiryDays);
}

// Consumption analysis over the trailing `windowDays` (default 90) of OUT+DISPOSAL transactions.
function computeConsumption(transactions, currentBalance, windowDays) {
  windowDays = windowDays || 90;
  const cutoff = addDays(todayISO(), -windowDays);
  const outTx = transactions.filter(t => (t.type === 'OUT' || t.type === 'DISPOSAL') && t.date >= cutoff);
  const totalOut = outTx.reduce((s, t) => s + Math.abs(t.quantity), 0);

  // Don't dilute the average for a recently-added item: divide by how long it has actually
  // existed in the ledger, not the full window, when that history is shorter than windowDays.
  const earliestDate = transactions.reduce((min, t) => (!min || t.date < min) ? t.date : min, null);
  const historyDays = earliestDate ? Math.max(1, daysBetween(earliestDate, todayISO())) : windowDays;
  const effectiveWindow = Math.max(1, Math.min(windowDays, historyDays));

  const avgDaily = totalOut / effectiveWindow;
  const avgMonthly = avgDaily * 30;
  let coverageDays = null;
  let estimatedStockoutDate = null;
  if (avgDaily > 0) {
    coverageDays = Math.floor(currentBalance / avgDaily);
    estimatedStockoutDate = addDays(todayISO(), coverageDays);
  }
  return { avgDaily, avgMonthly, coverageDays, estimatedStockoutDate, totalOut, windowDays: effectiveWindow };
}

function recommendedOrderQty(item, balance) {
  if (item.maximumStock === undefined || item.maximumStock === null || item.maximumStock === '') return null;
  const qty = item.maximumStock - balance;
  return qty > 0 ? qty : 0;
}

// Early-warning tier: item is still NORMAL but balance is approaching the reorder point,
// so QA can plan a purchase before it actually crosses into REORDER/LOW_STOCK/OUT_OF_STOCK.
// Kept separate from computeStockStatus()'s 4 canonical states (used by reports/exports and
// the brief's status-priority contract) so this is purely an additional, softer overlay.
function isApproachingReorder(balance, reorderPoint, earlyWarningPercent) {
  if (!(reorderPoint > 0)) return false;
  if (balance <= reorderPoint) return false; // already at/below reorder — that's the harder alarm, not "approaching"
  const pct = earlyWarningPercent === undefined || earlyWarningPercent === null ? 20 : earlyWarningPercent;
  const threshold = reorderPoint * (1 + pct / 100);
  return balance <= threshold;
}

// Aggregate inventory row builder — combines item + computed balance + status.
// `balancesByCode` and `lotsByCode` are Maps prebuilt by the caller for performance.
function buildInventoryRow(item, balance, lotsForItem, expiryWarningDays, earlyWarningPercent) {
  const status = computeStockStatus(balance, item.minimumStock, item.reorderPoint);
  const approaching = status === 'NORMAL' && isApproachingReorder(balance, item.reorderPoint, earlyWarningPercent);
  let worstExpiry = 'NORMAL';
  let nearestExpiry = null;
  (lotsForItem || []).forEach(lot => {
    if (lot.status === 'DISPOSED' || lot.status === 'DEPLETED') return;
    const es = computeExpiryStatus(lot, expiryWarningDays);
    if (STATUS_ORDER_EXPIRY(es) < STATUS_ORDER_EXPIRY(worstExpiry)) worstExpiry = es;
    const exp = effectiveExpiry(lot);
    if (exp && (!nearestExpiry || exp < nearestExpiry)) nearestExpiry = exp;
  });
  return {
    item, balance, status, approaching, expiryStatus: worstExpiry, nearestExpiry,
    lots: lotsForItem || []
  };
}

function STATUS_ORDER_EXPIRY(s) {
  return { EXPIRED: 0, EXPIRING_SOON: 1, NORMAL: 2 }[s];
}

function categoryLabel(cat) {
  return {
    CHEMICAL: 'Hóa chất',
    MICROBIOLOGY_MEDIA: 'Môi trường vi sinh',
    CONSUMABLE: 'Vật tư tiêu hao',
    LAB_SUPPLY: 'Vật tư phòng lab',
    OTHER: 'Khác'
  }[cat] || cat;
}

const AREA_OPTIONS = ['MICRO_LAB', 'CHEM_LAB', 'SENSO_LAB'];
function areaLabel(area) {
  return {
    MICRO_LAB: 'Micro Lab',
    CHEM_LAB: 'Chem Lab',
    SENSO_LAB: 'Senso Lab'
  }[area] || (area || '—');
}

// Full inventory snapshot in a small constant number of queries (scales to 500 items / 20k tx).
async function getInventorySnapshot() {
  const [items, allTx, allLots, settings] = await Promise.all([
    getAllItems(), getAllTransactions(), dbGetAll(STORES.stockLots), getSettings()
  ]);
  const balances = new Map();
  const txByItem = new Map();
  allTx.forEach(t => {
    balances.set(t.itemCode, (balances.get(t.itemCode) || 0) + signedQuantity(t.type, t.quantity));
    if (!txByItem.has(t.itemCode)) txByItem.set(t.itemCode, []);
    txByItem.get(t.itemCode).push(t);
  });
  const lotsByItem = new Map();
  allLots.forEach(l => {
    if (!lotsByItem.has(l.itemCode)) lotsByItem.set(l.itemCode, []);
    lotsByItem.get(l.itemCode).push(l);
  });
  return items.map(item => {
    const balance = balances.get(item.itemCode) || 0;
    const lots = lotsByItem.get(item.itemCode) || [];
    const row = buildInventoryRow(item, balance, lots, settings.expiryWarningDays, settings.earlyWarningPercent);
    row.transactions = txByItem.get(item.itemCode) || [];
    return row;
  });
}

  { itemCode: 'C043', itemName: 'Bactident Oxidase (strips)', category: 'LAB_SUPPLY', unit: 'hộp', location: 'Lab Micro', minimumStock: 1, reorderPoint: 1, maximumStock: 3, defaultSupplier: 'Merck', storageCondition: '2-8°C', expiryControl: true, PIC: 'Trieu' },
  { itemCode: 'C028', itemName: 'Gram Stain Kit (5 chai/bộ)', category: 'LAB_SUPPLY', unit: 'bộ', location: 'Lab Micro', minimumStock: 1, reorderPoint: 1, maximumStock: 3, defaultSupplier: 'Merck', storageCondition: 'Room temperature', expiryControl: true, PIC: 'Trieu' },
